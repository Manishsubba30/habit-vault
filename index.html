  SECURITY MODEL
  - No server, no network requests, no third-party code. Everything runs here.
  - Your passcode is stretched with PBKDF2-SHA256 (600,000 iterations, random
    16-byte salt) into a 256-bit AES-GCM key. The key never leaves memory and
    is marked non-extractable.
  - All data (habits, check-offs, tasks, settings) is encrypted with AES-256-GCM
    using a fresh random 12-byte IV on every save, then stored in this browser's
    localStorage. Only ciphertext is ever written to disk.
  - A wrong passcode fails GCM authentication, so nothing decrypts.
  - Progress photos are encrypted one by one with the same key and kept in IndexedDB.
  - Each person on a device has a separate vault, found by a SHA-256 hash of their name,
    so the lock screen never lists anyone. "Remember my name" is opt-in.
  - The passcode cannot be recovered. Keep an encrypted backup somewhere safe.

<style>
/* Layout: sticky top bar with tabs; month view = header stats, full-width habit grid,
   then chart + analysis side by side; collapses to one column on phones. */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --sunk:#eaecf4; --ink:#11142a; --muted:#565b78; --faint:#8a8fa8;
  --line:#e2e5ef; --line-strong:#c4c9db;
  --accent:#3047d8; --accent-ink:#ffffff; --accent-soft:#e4e8fd; --accent-line:#a9b5f4;
  --good:#12805b; --good-soft:#dbf2e8; --warn:#a35a00; --warn-soft:#fdebd3; --danger:#c42b45; --danger-soft:#fbe2e6;
  --weekend:#f6f7fb; --today:#fff2e6; --today-line:#ff7a1a; --flame:#ff7a1a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --b-needs:#2a78d6; --b-wants:#eb6834; --b-save:#1baf7a;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0d18; --surface:#141729; --sunk:#1c2038; --ink:#e8eaf6; --muted:#a3a8c3; --faint:#6e7392;
  --line:#252a46; --line-strong:#383e62;
  --accent:#7d8eff; --accent-ink:#0b0d18; --accent-soft:#20264f; --accent-line:#3b4691;
  --good:#4fd1a1; --good-soft:#12342a; --warn:#ffb35c; --warn-soft:#3a2911; --danger:#ff7d91; --danger-soft:#3d1621;
  --weekend:#10132a; --today:#2b1e14; --today-line:#ff9447; --flame:#ff9447;
  --b-needs:#3987e5; --b-wants:#d95926; --b-save:#199e70;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0d18; --surface:#141729; --sunk:#1c2038; --ink:#e8eaf6; --muted:#a3a8c3; --faint:#6e7392;
  --line:#252a46; --line-strong:#383e62;
  --accent:#7d8eff; --accent-ink:#0b0d18; --accent-soft:#20264f; --accent-line:#3b4691;
  --good:#4fd1a1; --good-soft:#12342a; --warn:#ffb35c; --warn-soft:#3a2911; --danger:#ff7d91; --danger-soft:#3d1621;
  --weekend:#10132a; --today:#2b1e14; --today-line:#ff9447; --flame:#ff9447;
  --b-needs:#3987e5; --b-wants:#d95926; --b-save:#199e70;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:15px;font-weight:650}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons & inputs */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.icon{padding:6px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{font-family:var(--mono);font-size:12px;resize:vertical;min-height:90px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;min-height:1.2em;margin:0}
.msg.err{color:var(--danger)} .msg.ok{color:var(--good)}

/* ---------- lock screen ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding-block:48px}
.lock-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px}
.mark i{background:var(--accent-ink);border-radius:1.5px;opacity:.95}
.mark i:nth-child(2),.mark i:nth-child(6),.mark i:nth-child(7){opacity:.3}
.lock h1{font-size:28px;letter-spacing:-.025em;font-weight:760}
.lock form{display:flex;flex-direction:column;gap:12px}
.lock .input{font-size:18px;padding:11px 12px;letter-spacing:.12em}
.lock .btn.primary{justify-content:center;padding:11px;font-size:15px}
.fine{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
details.restore{border-top:1px solid var(--line);padding-top:14px}
details.restore summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
details.restore[open] summary{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- app shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.status.saving .dot{background:var(--warn)}
.status.error{color:var(--danger)} .status.error .dot{background:var(--danger)}
main.view{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* month header */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.mtitle{display:flex;align-items:center;gap:6px}
.mtitle h1{font-size:34px;font-weight:780;letter-spacing:-.035em;line-height:1;min-width:0}
.mtitle .yr{font-family:var(--mono);font-size:15px;color:var(--faint);font-weight:500;margin-left:6px;letter-spacing:0}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:flex-end}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:13px;color:var(--faint);font-weight:500}
.stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pbar{width:180px;max-width:100%;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:6px}
.pbar > i{display:block;height:100%;background:var(--accent);border-radius:5px 4px 4px 5px;transition:width .3s}

/* habit grid */
.grid-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
.grid th,.grid td{padding:2px 1px;text-align:center;white-space:nowrap}
.grid .hcol{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding-right:12px;min-width:150px;max-width:220px;font-weight:550;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.grid thead .hcol{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);vertical-align:bottom;padding-bottom:6px}
.grid tr.wk th{font-size:10.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px}
.grid tr.wk th + th{border-left:6px solid var(--surface)}
.grid tr.dow th{font-size:10px;color:var(--faint);font-weight:600;padding-top:4px}
.grid tr.dnum th{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;padding-bottom:4px}
.grid .we{background:var(--weekend)}
.grid .td{background:var(--today)}
.grid tr.dnum th.td{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--today-line)}
.grid tbody th.hcol{border-top:1px solid var(--line)}
.grid tbody td{border-top:1px solid var(--line)}
.grid tbody tr:hover .hcol{color:var(--accent)}
.grid .tot{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);padding-left:10px;text-align:right}
.grid .ws{border-left:6px solid var(--surface)}
.cb{position:relative;width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--surface);padding:0;display:block;margin:auto}
.cb:hover:not(:disabled){border-color:var(--accent)}
.cb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.cb[aria-pressed="true"]::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb:disabled{opacity:.35;cursor:default;border-style:dashed}
.grid tfoot th,.grid tfoot td{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.grid tfoot tr:first-child th,.grid tfoot tr:first-child td{border-top:2px solid var(--line-strong);padding-top:6px}
.grid tfoot .hcol{font-family:var(--font);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.grid tfoot .full{color:var(--accent);font-weight:700}
.addrow{display:flex;gap:8px;margin-top:14px;max-width:640px;flex-wrap:wrap}
.addrow.big{margin:0 0 14px}
.addrow input[id$="-name"]{flex:1 1 200px}
.addrow select.input{width:auto;flex:0 0 auto}
.addrow input[type=number]{width:64px;flex:0 0 auto}
.gtag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);background:var(--sunk);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;letter-spacing:0;text-transform:none}
.grid .hcol .hn{overflow:hidden;text-overflow:ellipsis}
.cb.rest{border-style:dashed;border-color:var(--line-strong);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--sunk) 3px 5.5px)}
.cb.miss{border-color:var(--danger);background:var(--danger-soft)}
.cb.due{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cb.na{opacity:.35}
.glegend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.glegend .cb.sw{width:14px;height:14px;border-radius:3.5px;margin:0;display:inline-block;flex:none}
.glegend .cb.sw[aria-pressed="true"]::after{left:3.5px;top:0.5px;width:4px;height:8px;border-width:0 1.5px 1.5px 0}
.grid tfoot td.bad{color:var(--danger);font-weight:700}
.grid tr.wk th.other{color:var(--faint);font-weight:500}
.wpills{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.wpill{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);font-family:var(--mono)}
.wpill b{font-weight:700}
.wpill.met{background:var(--good-soft);border-color:transparent;color:var(--good)}
.wpill.miss{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.wpill.cur{border-color:var(--accent-line);color:var(--ink)}
.wpill.fut{border-style:dashed;opacity:.7}
.glist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 26px}
.gitem{display:flex;flex-direction:column;gap:5px;min-width:0}
.gtop{display:flex;justify-content:space-between;gap:8px}
.gtop .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtop .ct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gitem .gtag{margin-left:0}
.rtag{font-size:10.5px;color:var(--faint);border:1px dashed var(--line-strong);border-radius:4px;padding:0 4px;margin-left:4px;text-decoration:none;display:inline-block}
.rtag.bad{color:var(--danger);border:1px solid var(--danger)}
.titem.isrest .tx{color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

/* chart */
.chart{position:relative;width:100%;height:220px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--faint);font-size:10.5px;font-family:var(--mono)}
.chart .area{fill:var(--accent);opacity:.16}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .ln.today{stroke-dasharray:3 4;opacity:.7}
.chart .tdot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .xh{stroke:var(--line-strong);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;line-height:1.35}
.tip b{font-family:var(--mono);font-weight:700}

/* analysis */
.alist{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.aitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.aitem .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem .ct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.abar{grid-column:1/-1;position:relative;height:8px;background:var(--sunk);border-radius:4px}
.abar > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.abar > b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.ameta{grid-column:1/-1;display:flex;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:1px 7px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend .sw{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin-right:5px}
.legend .pk{display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.55;vertical-align:middle;margin-right:5px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.week{grid-template-columns:minmax(0,1fr)}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.day.is-today{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.day-h{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day-h .dn{font-weight:700}
.day-h .dd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.day.is-today .day-h{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.is-today .day-h .dd{color:var(--accent-ink);opacity:.85}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 10px}
.ring{width:84px;height:84px}
.ring .tr{fill:none;stroke:var(--sunk);stroke-width:8}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dasharray .3s}
.ring text{fill:var(--ink);font-family:var(--mono);font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.ringbox .sub{font-size:11.5px;color:var(--muted);text-align:center}
.tasks{list-style:none;margin:0;padding:6px 10px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);flex:1}
.tasks .sec{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:650;padding:6px 2px 2px}
.titem{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;border-radius:6px}
.titem:hover{background:var(--sunk)}
.titem .cb{width:18px;height:18px;margin:1px 0 0;flex:none;border-radius:4px}
.titem .cb[aria-pressed="true"]::after{left:4.5px;top:1px;width:4px;height:9px}
.titem .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.titem.done .tx{color:var(--faint);text-decoration:line-through}
.titem .x{border:0;background:none;color:var(--faint);padding:0 4px;opacity:0;font-size:15px;line-height:1}
.titem:hover .x,.titem .x:focus-visible{opacity:1}
@media (hover:none){.titem .x{opacity:.7}}
.tadd{display:flex;padding:8px 10px 10px;gap:6px}
.tadd .input{padding:6px 8px;font-size:13px}

/* habits & settings */
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.hmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.goalsel .hint{font-size:12px;color:var(--muted)}
.goalsel select.input{width:auto}
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.hgrid{grid-template-columns:minmax(0,1fr)}}
.how{display:flex;flex-direction:column;gap:10px}
.how p{margin:0;font-size:13px;color:var(--muted);max-width:62ch}
.how b{color:var(--ink);font-weight:650}
.hrow:first-child{border-top:0}
.hrow .mv{display:flex;flex-direction:column;gap:2px}
.hrow .mv button{border:1px solid var(--line);background:var(--surface);border-radius:5px;width:26px;height:18px;font-size:10px;line-height:1;padding:0;color:var(--muted)}
.goalsel{display:flex;gap:6px;align-items:center}
.goalsel .input{padding:7px 8px}
.goalsel input.input{width:62px}
@media (max-width:640px){.hrow{grid-template-columns:auto minmax(0,1fr)}.hrow .del{grid-column:2;justify-self:start}}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.settings{grid-template-columns:minmax(0,1fr)}}
.settings .card{display:flex;flex-direction:column;gap:12px}
.settings p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12.5px}
.danger-zone{border-color:var(--danger)}
@media (max-width:560px){.mtitle h1{font-size:28px}.stats{gap:10px 20px}.stat .v{font-size:19px}.top .status .lbl{display:none}.top .tabs{order:5;width:100%}.top .tab{flex:1;padding:6px 4px}}

/* ---------- playbook (its own editorial look: serif display, themed hero per habit) ---------- */
.pb-bar{display:flex;gap:10px;align-items:center}
.pb-bar > .btn{flex:none}
.pb-picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;flex:1;min-width:0}
.pe{display:flex;flex-direction:column;gap:18px;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.pe-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pe-top h2{font-family:var(--serif);font-size:22px;font-weight:600}
.pe-top .fine{margin:4px 0 0}
.pe-sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.pe-sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:0}
.pe-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pe-h .btn{padding:4px 8px;font-size:12.5px}
.pe-row{display:flex;gap:6px;align-items:flex-start}
.pe textarea.input{font-family:var(--font);font-size:13.5px}
.pe-row textarea.input{font-family:var(--font);font-size:13.5px;min-height:0;resize:vertical;line-height:1.45}
.pe-row .x{margin-top:8px}
.pe-q{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.pe-row.quote textarea.input{font-family:var(--serif);font-size:15.5px}
.pe-row.quote input.input{font-size:12.5px;padding:6px 9px}
.pe-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
@media (max-width:760px){.pe-cols{grid-template-columns:minmax(0,1fr)}}
.pe .fine{margin:0}
.pb-chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:550;font-size:13px;color:var(--muted)}
.pb-chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pb-chip[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pb-hero{position:relative;overflow:hidden;border-radius:18px;color:#fff;min-height:300px;display:flex;align-items:flex-end;isolation:isolate;
  background:radial-gradient(120% 90% at 92% 0%, color-mix(in srgb,var(--h3) 45%,transparent) 0%, transparent 55%), linear-gradient(135deg,var(--h1) 0%,var(--h2) 100%)}
.pb-hero.has-photo{background:linear-gradient(90deg,var(--h1) 0%,color-mix(in srgb,var(--h1) 82%,transparent) 38%,color-mix(in srgb,var(--h1) 10%,transparent) 80%), var(--photo) center/cover no-repeat, var(--h2)}
.pb-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 64px)}
.pb-motif{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:min(52%,460px);height:auto;color:var(--h3);opacity:.22;z-index:-1}
.pb-hero.has-photo .pb-motif{display:none}
.pb-hero-in{padding:28px clamp(18px,4vw,40px) 26px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.pb-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;color:var(--h3)}
.pb-title{font-family:var(--serif);font-weight:600;font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.02em;text-wrap:balance}
.pb-tag{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.2vw,21px);color:rgba(255,255,255,.86);max-width:36ch}
.pb-stats{display:flex;gap:10px 30px;flex-wrap:wrap;margin-top:8px}
.pb-stats div{display:flex;flex-direction:column}
.pb-stats b{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.pb-stats b small{font-size:14px;opacity:.65;font-weight:500;margin-left:1px}
.pb-stats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.pb-photo-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pb-btn{cursor:pointer;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.pb-btn:hover{background:rgba(255,255,255,.26)}
.pb-btn.ghost{background:transparent}
.pb-photo-msg{font-size:12px;color:rgba(255,255,255,.8)}
.pb-quote{margin:0;padding:26px clamp(18px,4vw,40px);border-radius:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.pb-quote::before{content:"\201C";position:absolute;left:10px;top:-34px;font-family:var(--serif);font-size:170px;line-height:1;color:var(--h2);opacity:.14}
.pb-quote blockquote{margin:0;font-family:var(--serif);font-size:clamp(20px,2.6vw,27px);line-height:1.35;text-wrap:balance;position:relative;max-width:46ch}
.pb-quote figcaption{margin-top:12px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pb-quote figcaption::before{content:"";width:28px;height:2px;background:var(--h2)}
.pb-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.pb-cards{grid-template-columns:minmax(0,1fr)}}
.pb-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.pb-k{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.pb-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.pb-card li{position:relative;padding-left:22px;font-size:14px;line-height:1.5;max-width:62ch}
.pb-card li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:2px;background:var(--line-strong)}
.pb-card.gain li::before{background:var(--good);border-radius:50%}
.pb-card.cost li::before{background:var(--danger);width:10px;height:2px;top:.72em;border-radius:1px}
.pb-card.roi{background:var(--accent-soft);border-color:var(--accent-line)}
.pb-card p{margin:0;font-size:14px;max-width:62ch}
.pb-big{font-family:var(--serif);font-size:44px!important;font-weight:600;line-height:1;letter-spacing:-.02em}
.pb-big small{font-size:18px;font-family:var(--font);font-weight:500;color:var(--muted)}
.pb-note{font-size:12.5px!important;color:var(--muted)}
.pb-alert{color:var(--danger);font-size:13.5px!important}
.pb-ok{color:var(--good);font-size:13.5px!important}
.pb-inl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pb-inl input.input{width:84px;padding:5px 8px}
.pb-inl select.input{width:auto;padding:5px 8px}
.pb-mine{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.pb-mine{grid-template-columns:minmax(0,1fr)}}
.pb-ta{font-family:var(--serif)!important;font-size:16px!important;min-height:96px;line-height:1.45;background:var(--surface)}
.flash{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

/* ---------- money ---------- */
.mn{display:flex;flex-direction:column;gap:16px}
.mn h3{font-size:14px;font-weight:650;margin:0}
.mn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mn-title{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.01em}
.mn-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 120px;gap:12px;align-items:stretch}
@media (max-width:820px){.mn-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.mn-ring{grid-column:1/-1;justify-self:center}}
.mn-kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mn-kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mn-kpi b{font-family:var(--mono);font-size:clamp(18px,2.3vw,24px);font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mn-kpi b.neg{color:var(--danger)}
.mn-kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.mn-ring{display:grid;place-items:center}
.mn-rsvg{width:118px;height:118px}
.mn-rsvg .tr{fill:none;stroke:var(--sunk);stroke-width:10}
.mn-rsvg .fg{fill:none;stroke:var(--b-save);stroke-width:10;stroke-linecap:round}
.mn-rsvg .tk{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.mn-rsvg .v{fill:var(--ink);font-family:var(--mono);font-size:19px;font-weight:700;text-anchor:middle}
.mn-rsvg .l{fill:var(--muted);font-size:8.5px;text-anchor:middle}
.mn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.mn-grid{grid-template-columns:minmax(0,1fr)}}
.mn-grid .card,.mn > .card{display:flex;flex-direction:column;gap:10px}
.mn-form{display:flex;gap:8px;flex-wrap:wrap}
.mn-form .input{flex:1 1 140px;width:auto}
.mn-form .mn-amt{flex:0 1 120px;font-size:16px;font-weight:600}
.mn-form input[type=date]{flex:0 1 150px}
.mn-inc{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.mn-inc li,.mn-day li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;font-size:13px}
.mn-inc li:hover,.mn-day li:hover{background:var(--sunk)}
.mn-inc li span{flex:1;min-width:0}
.mn-inc em,.mn-day em{font-style:normal;color:var(--faint);font-size:12px}
.mn-inc b,.mn-day b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--faint);padding:0 4px;font-size:16px;line-height:1}
.x:hover{color:var(--danger)}
.bk{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;vertical-align:middle;margin-right:6px}
.bk.needs{background:var(--b-needs)} .bk.wants{background:var(--b-wants)} .bk.savings{background:var(--b-save)}
.bkf.needs{fill:var(--b-needs)} .bkf.wants{fill:var(--b-wants)} .bkf.savings{fill:var(--b-save)}
.mn-split .legend .bk{margin-right:5px}
.mn-split-in{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:480px){.mn-split-in{grid-template-columns:minmax(0,1fr)}.mn-donut{justify-self:center}}
.mn-donut{width:170px;height:170px}
.mn-donut svg{width:100%;height:100%}
.mn-donut path{stroke:var(--surface);stroke-width:1}
.mn-donut .dv{fill:var(--ink);font-family:var(--mono);font-size:19px;font-weight:700;text-anchor:middle}
.mn-donut .dl{fill:var(--muted);font-size:10px;text-anchor:middle}
.mn-split-f{display:flex;flex-direction:column;gap:8px}
.mn-pct{display:grid;grid-template-columns:auto minmax(0,1fr) 62px auto minmax(70px,auto);gap:6px;align-items:center;font-size:13px}
.mn-pct input.input{padding:5px 7px;text-align:right}
.mn-pct em{font-style:normal;color:var(--muted)}
.mn-pct b{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--muted)}
.mn-presets{gap:4px}
.mn-presets .btn{padding:4px 8px;font-size:12px;font-family:var(--mono)}
.mn-pva{display:flex;flex-direction:column;gap:12px}
.pva-t{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.pva-t em{font-style:normal;color:var(--muted)}
.pva-bar{position:relative;height:12px;border-radius:6px;background:var(--sunk);margin-top:5px}
.pva-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;margin:0;width:auto;height:auto}
.pva-bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.pva-s{font-size:12px;color:var(--muted);margin-top:4px}
.pva-s.bad{color:var(--danger);font-weight:600}
.mn-chart{position:relative;width:100%;height:230px}
.mn-chart.small{height:120px}
.mn-chart svg{display:block;width:100%;height:100%;overflow:visible}
.mn-chart .gl{stroke:var(--line);stroke-width:1}
.mn-chart .ax{fill:var(--faint);font-size:10.5px;font-family:var(--mono)}
.mn-chart .ax.strong{fill:var(--ink);font-weight:700}
.mn-chart .pace{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.mn-chart .marea{fill:var(--b-wants);opacity:.14}
.mn-chart .mln{fill:none;stroke:var(--b-wants);stroke-width:2;stroke-linejoin:round}
.mn-chart .mend{fill:var(--b-wants);stroke:var(--surface);stroke-width:2}
.mn-chart .mbar{fill:var(--b-wants);opacity:.85}
.mn-chart .mbar.today{opacity:1}
.mn-chart .xh{stroke:var(--line-strong)}
.legend .mn-sw{background:var(--b-wants)}
.legend .dash{display:inline-block;width:16px;border-top:2px dashed var(--muted);vertical-align:middle;margin-right:5px}
.mn-cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mc-t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mc-t em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.mc-bar{height:8px;border-radius:4px;background:var(--sunk);margin-top:4px;overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:4px;margin:0}
.mn-catman{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.mn-catman summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.mn-catman[open] summary{margin-bottom:10px}
.mn-catman ul{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:6px}
.mn-catman li{display:flex;gap:6px;align-items:center}
.mn-catman li .input{padding:5px 8px;font-size:13px}
.mn-catman li select.input{width:auto;flex:none}
.mn-catman .mn-form{margin-bottom:10px}
.mn-days{display:flex;flex-direction:column;gap:12px;max-height:460px;overflow-y:auto}
.mn-day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 4px;border-bottom:1px solid var(--line)}
.mn-day-h b{color:var(--ink);font-family:var(--mono)}
.mn-day ul{list-style:none;margin:4px 0 0;padding:0}
.mn-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hn-btn{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hn-btn:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}


/* ---------- profiles ---------- */
.prof-row{display:flex;gap:8px;flex-wrap:wrap}
.prof{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.prof .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--line-strong))}
.prof.add .av{background:var(--sunk);color:var(--muted);font-size:15px}
.prof.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.who .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--c)}

/* ---------- gym ---------- */
.gy{display:flex;flex-direction:column;gap:16px}
.gy-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.gy-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mn-kpi b small{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gy-form .gy-ex{flex:1 1 100%}
.gy-n{display:inline-flex;align-items:center;gap:5px;flex:1 1 90px;font-size:12.5px;color:var(--muted)}
.gy-n .input{width:100%;min-width:0;font-size:16px;font-weight:600;padding:7px 8px}
.gy-today{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.gy-sess{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gy-sess li{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.gy-sets{display:flex;flex-wrap:wrap;gap:5px}

<body>
<div id="app"></div>

<script>
'use strict';
/* ================= constants & small helpers ================= */
const APP = 'habitvault', VERSION = 1, ITER = 600000, MIN_PASS = 6;
const VAULT_KEY = 'habitvault.vault.v1', THROTTLE_KEY = 'habitvault.throttle.v1';
const AAD = new TextEncoder().encode('habitvault:v1');
const SAMPLE_HABITS = [['Wake up at 05:00','daily',0],['Gym','week',5],['Reading / learning','week',6],['Budget tracking','week',1],['Project work','week',5],['No alcohol','daily',0],['Social media detox','daily',0],['Goal journaling','daily',0],['Cold shower','month',20]];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymd = (y, m, d) => `${y}-${pad(m+1)}-${pad(d)}`;
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2,'0')).join('');
const dowIdx = d => (d.getDay() + 6) % 7; // Monday = 0
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - dowIdx(x)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};

/* ================= crypto ================= */
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations: iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function seal(sess){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const pt = new TextEncoder().encode(JSON.stringify(sess.data));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData: AAD }, sess.key, pt));
  return { app: APP, v: VERSION, kdf: { alg:'PBKDF2-SHA256', iter: sess.iter, salt: b64e(sess.salt) }, cipher:'AES-256-GCM', iv: b64e(iv), ct: b64e(ct) };
}
function validRecord(r){ return r && r.app === APP && r.v === VERSION && r.kdf && typeof r.kdf.salt === 'string' && Number.isInteger(r.kdf.iter) && r.kdf.iter >= 100000 && typeof r.iv === 'string' && typeof r.ct === 'string'; }
async function unseal(rec, pass){
  const salt = b64d(rec.kdf.salt), iter = rec.kdf.iter;
  const key = await deriveKey(pass, salt, iter);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(rec.iv), additionalData: AAD }, key, b64d(rec.ct)); // throws on wrong passcode
  return { key, salt, iter, data: normalize(JSON.parse(new TextDecoder().decode(pt))) };
}
async function newSession(pass, data){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { key: await deriveKey(pass, salt, ITER), salt, iter: ITER, data };
}
function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  const habits = (Array.isArray(d.habits) ? d.habits : []).map(h => {
    const freq = h.freq || (h.goal ? 'month' : 'daily');
    return { id: h.id, name: h.name, created: h.created || null, freq, target: freq === 'daily' ? 0 : Math.max(1, Math.min(freq === 'week' ? 7 : 31, h.target || h.goal || 1)) };
  });
  return { v:1, habits, checks: d.checks || {}, tasks: d.tasks || {}, pages: d.pages || {}, money: d.money || null, gym: d.gym || null, settings: Object.assign({ autoLock: 5 }, d.settings || {}) };
}

/* ================= profiles: one encrypted vault per person on this device ================= */
/* Profile names are stored in plain text so the lock screen can list them; everything else is encrypted. */
const PROFILES_KEY = 'habitvault.profiles.v1', LAST_KEY = 'habitvault.lastProfile.v1';
let PROFILE = store.get(LAST_KEY) || 'default';
const vaultKey = (id = PROFILE) => id === 'default' ? VAULT_KEY : `${VAULT_KEY}.${id}`;
const throttleKey = (id = PROFILE) => id === 'default' ? THROTTLE_KEY : `${THROTTLE_KEY}.${id}`;
function rawProfiles(){ try { const l = JSON.parse(store.get(PROFILES_KEY)); return Array.isArray(l) ? l : []; } catch { return []; } }
function profiles(){
  const list = rawProfiles();
  if (!list.some(p => p.id === 'default') && store.get(VAULT_KEY)) list.unshift({ id:'default', name:'Me' });
  return list.filter(p => store.get(vaultKey(p.id)));
}
function upsertProfile(id, name){
  const list = profiles(), entry = { id, name: (name || 'Me').slice(0, 30) }, at = list.findIndex(p => p.id === id);
  if (at >= 0) list[at] = entry; else list.push(entry);
  store.set(PROFILES_KEY, JSON.stringify(list));
}
function removeProfile(id){ store.set(PROFILES_KEY, JSON.stringify(profiles().filter(p => p.id !== id))); }
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const AV = ['#2c7a4c','#2a78d6','#c2410c','#6250d6','#0e7490','#a21caf'];
const avColor = id => AV[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];

/* ================= encrypted photo store ================= */
/* Each photo is encrypted on its own with the vault key (AES-256-GCM, fresh IV, photo id bound as AAD) and kept in
   IndexedDB, which has far more room than localStorage. If IndexedDB is unavailable it falls back to localStorage. */
const PH_LS = 'habitvault.photo.';
let idbP = null;
function idb(){
  if (!idbP) idbP = new Promise((res, rej) => {
    try { const r = indexedDB.open('habitvault', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); }
    catch (e){ rej(e); }
  });
  return idbP;
}
function idbReq(mode, fn){
  return idb().then(db => new Promise((res, rej) => {
    const t = db.transaction('photos', mode), r = fn(t.objectStore('photos'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
}
const phStore = {
  async put(k, v){ try { await idbReq('readwrite', s => s.put(v, k)); } catch { if (!store.set(PH_LS + k, JSON.stringify(v))) throw new Error('full'); } },
  async get(k){ try { const v = await idbReq('readonly', s => s.get(k)); if (v) return v; } catch {} try { return JSON.parse(store.get(PH_LS + k)); } catch { return null; } },
  async del(k){ try { await idbReq('readwrite', s => s.delete(k)); } catch {} store.del(PH_LS + k); },
  async keys(prefix){
    let ks = []; try { ks = (await idbReq('readonly', s => s.getAllKeys())) || []; } catch {}
    try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith(PH_LS)) ks.push(k.slice(PH_LS.length)); } } catch {}
    return [...new Set(ks.map(String))].filter(k => k.startsWith(prefix));
  },
};
const phAAD = id => new TextEncoder().encode('habitvault:photo:' + id);
async function phEnc(key, id, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv: b64e(iv), ct: b64e(new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData: phAAD(id) }, key, bytes))) }; }
async function phDec(key, id, r){ return crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(r.iv), additionalData: phAAD(id) }, key, b64d(r.ct)); }
async function photoPut(id, bytes){ await phStore.put(`${S.profile}:${id}`, await phEnc(S.key, id, bytes)); }
const photoURLs = new Map();
async function photoURL(id){
  if (photoURLs.has(id)) return photoURLs.get(id);
  const r = await phStore.get(`${S.profile}:${id}`); if (!r) return null;
  const u = URL.createObjectURL(new Blob([await phDec(S.key, id, r)], { type:'image/jpeg' }));
  photoURLs.set(id, u); return u;
}
function revokePhotos(){ for (const u of photoURLs.values()) URL.revokeObjectURL(u); photoURLs.clear(); }
async function photoDel(id){ await phStore.del(`${S.profile}:${id}`); const u = photoURLs.get(id); if (u){ URL.revokeObjectURL(u); photoURLs.delete(id); } }
async function photoAllRaw(profile){ const out = {}; for (const k of await phStore.keys(profile + ':')){ const v = await phStore.get(k); if (v) out[k.slice(profile.length + 1)] = v; } return out; }
async function photoClear(profile){ for (const k of await phStore.keys(profile + ':')) await phStore.del(k); }
async function photoReencrypt(profile, oldKey, newKey){
  const all = await photoAllRaw(profile), out = {};
  for (const [id, r] of Object.entries(all)) out[id] = await phEnc(newKey, id, await phDec(oldKey, id, r));
  for (const [id, v] of Object.entries(out)) await phStore.put(`${profile}:${id}`, v);

async function hydratePhotos(){

function imageToJpeg(file, maxSide = 1400, q = 0.8){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('decode'));
      img.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(b => b ? b.arrayBuffer().then(res, rej) : rej(new Error('encode')), 'image/jpeg', q);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---- goal engine ----
   Every habit has a frequency: 'daily', 'week' (N days per Mon–Sun week) or 'month' (N days per calendar month).
   A period (one week or one month) has (length − target) rest days. Skipped days use up those rest days first,
   in date order; only skips beyond them count as missed. A weekly period always covers all 7 days, even
   when the week crosses a month boundary. For monthly summaries a week belongs to the month holding its
   Thursday (the ISO 8601 rule), so a week is never split or counted twice. */
const todayKey = () => dkey(new Date());
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayDiff = (a, b) => Math.round((midnight(b) - midnight(a)) / 864e5);
const maxTarget = f => f === 'week' ? 7 : 31;
const shortGoal = h => h.freq === 'week' ? `${h.target}/wk` : h.freq === 'month' ? `${h.target}/mo` : 'daily';
const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'}`;
function goalText(h){
  if (h.freq === 'week') return `${plural(h.target, 'day')} a week · ${plural(7 - h.target, 'rest day')}`;
  if (h.freq === 'month') return `${plural(h.target, 'day')} a month`;
  return 'Every day';
}
function periodOf(h, d){
  if (h.freq === 'week'){ const s = startOfWeek(d); return { s, e: addDays(s, 6), target: Math.min(h.target, 7) }; }
  const s = new Date(d.getFullYear(), d.getMonth(), 1), e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { s, e, target: h.freq === 'month' ? Math.min(h.target, e.getDate()) : e.getDate() };
}
function evalPeriod(h, per){
  const tk = todayKey(), map = {}, len = dayDiff(per.s, per.e) + 1, allowance = len - per.target;
  let done = 0, missed = 0, rest = 0;
  for (let d = new Date(per.s); d <= per.e; d = addDays(d, 1)){
    const k = dkey(d);
    if (checked(h.id, k)){ map[k] = 'done'; done++; continue; }
    if (k > tk){ map[k] = 'future'; continue; }
    if (h.created && k < h.created){ map[k] = 'na'; continue; }
    if (k < tk){ if (rest < allowance){ map[k] = 'rest'; rest++; } else { map[k] = 'missed'; missed++; } continue; }
    map[k] = rest + missed >= allowance ? 'due' : 'optional'; // today: needed only once rest days are used up
  }
  const t0 = midnight(new Date());
  const status = done >= per.target ? 'met' : missed > 0 ? 'off' : per.e < t0 ? 'short' : 'on';
  return { ...per, map, done, missed, rest, allowance, restLeft: Math.max(0, allowance - rest - missed), status };
}
function evalRange(h, start, end){
  const map = {}, periods = [];
  let d = new Date(start);
  while (d <= end){ const p = evalPeriod(h, periodOf(h, d)); periods.push(p); Object.assign(map, p.map); d = addDays(p.e, 1); }
  return { map, periods };
}
function dayTally(evs, k){
  let done = 0, due = 0, missed = 0, active = 0;
  for (const ev of evs){
    const s = ev.map[k]; if (!s || s === 'na' || s === 'future') continue;
    active++;
    if (s === 'done'){ done++; due++; } else if (s === 'missed'){ missed++; due++; } else if (s === 'due') due++;
  }
  return { done, due, missed, active, pct: active ? (due ? Math.round(done / due * 100) : 100) : null };
}
function weeksForMonth(y, m){
  const out = [], end = new Date(y, m + 1, 0);
  for (let w = startOfWeek(new Date(y, m, 1)); ; w = addDays(w, 7)){
    const th = addDays(w, 3);
    if (th > end) break;
    if (th.getMonth() === m) out.push(w);
  }
  return out;
}
function dayStreak(h){
  let d = new Date(); if (!checked(h.id, dkey(d))) d = addDays(d, -1);
  let n = 0; while (n < 4000 && checked(h.id, dkey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function weekStreak(h){
  let w = startOfWeek(new Date()), n = 0;
  if (evalPeriod(h, periodOf(h, w)).status === 'met') n++;
  for (let i = 0; i < 520; i++){ w = addDays(w, -7); if (evalPeriod(h, periodOf(h, w)).status === 'met') n++; else break; }
  return n;
}

async function doRestore(p){
  const msg = $(`#${p}-msg`); const say = (t, c) => { msg.textContent = t; msg.className = 'msg ' + (c || ''); };
  let rec; try { rec = JSON.parse($(`#${p}-text`).value.trim()); } catch { return say('That text isn\'t a Habit Vault backup.', 'err'); }
  if (!validRecord(rec)) return say('That text isn\'t a Habit Vault backup.', 'err');
  const pass = $(`#${p}-pass`).value; if (!pass) return say('Enter the passcode for this backup.', 'err');
  // In the app: replaces the logged-in person's vault. On the lock screen: creates a new vault under a new name,
  // so a backup can never overwrite someone else's vault.
  let id, name;
  if (!S){
    name = ($(`#${p}-name`)?.value || '').trim().slice(0, 30); if (!name) return say('Enter the name you want to log in with.', 'err');
    id = await userId(name); if (store.get(vaultKey(id))) return say('That name already has a vault on this device. Pick another name, or log in.', 'err');
  }
  say('Decrypting…');
  let sess; try { sess = await unseal(rec, pass); } catch { return say('Wrong passcode for this backup, or the file is damaged.', 'err'); }
  if (S){ await flush(); id = S.profile; name = S.data.settings.username || ''; }
  const photos = rec.photos || {}, clean = { ...rec }; delete clean.photos;
  if (!store.set(vaultKey(id), JSON.stringify(clean))) return say('This browser has no room to store the backup.', 'err');
  try { await photoClear(id); for (const [pid, pr] of Object.entries(photos)) await phStore.put(`${id}:${pid}`, pr); }
  catch { say('Restored, but some photos could not be stored (the browser is out of space).', 'err'); }
  revokePhotos();
  sess.profile = id; S = sess; PROFILE = id; store.del(throttleKey(id));

  resetUI(); renderApp(); scheduleSave();
}

  // ISO week groups; mark weeks whose Thursday is in another month
  const groups = [];
  for (let d = 1; d <= days; d++){ const dt = new Date(y, m, d), w = isoWeek(dt); const g = groups[groups.length - 1]; if (g && g.w === w) g.n++; else groups.push({ w, n: 1, start: d, th: addDays(startOfWeek(dt), 3) }); }
  const weekStarts = new Set(groups.slice(1).map(g => g.start));
  const colCls = d => { const dt = new Date(y, m, d), k = ymd(y, m, d); return [dowIdx(dt) >= 5 ? 'we' : '', k === tk ? 'td' : '', weekStarts.has(d) ? 'ws' : ''].join(' ').trim(); };

  const grid = !H.length ? `<div class="empty">No habits yet. Add your first one below.</div>` : `
  <div class="grid-wrap" data-ym="${y}-${m}"><table class="grid">
    <thead>
      <tr class="wk"><th class="hcol" rowspan="3">My habits</th>${groups.map(g => { const other = g.th.getMonth() !== m; return `<th colspan="${g.n}" class="${other ? 'other' : ''}" ${other ? `title="Week ${g.w} counts toward ${MONTHS[g.th.getMonth()]}: it holds most of that week's days"` : ''}>${g.n < 3 ? 'W' : 'Week '}${g.w}${other ? ' ↗' : ''}</th>`; }).join('')}<th rowspan="3" class="tot" style="vertical-align:bottom;font-size:10.5px">Done</th></tr>
      <tr class="dow">${range.map(d => `<th class="${colCls(d)}">${DOW[dowIdx(new Date(y, m, d))].slice(0, 2)}</th>`).join('')}</tr>
      <tr class="dnum">${range.map(d => `<th class="${colCls(d)}">${d}</th>`).join('')}</tr>
    </thead>
    <tbody>${H.map((h, hi) => {
      const tot = range.filter(d => checked(h.id, ymd(y, m, d))).length;
      return `<tr><th class="hcol" title="${esc(h.name)} · ${goalText(h)}"><button class="hn hn-btn" data-act="pbgo" data-h="${h.id}" title="Open the ${esc(h.name)} playbook">${esc(h.name)}</button><span class="gtag">${shortGoal(h)}</span></th>${range.map(d => {
        const k = ymd(y, m, d);
        return `<td class="${colCls(d)}">${habitCell(h, k, evs[hi].map[k], d > elapsed, `${h.name}, ${MONTHS[m]} ${d}`)}</td>`;
      }).join('')}<td class="tot">${tot}</td></tr>`; }).join('')}
    </tbody>
    <tfoot>
      <tr><th class="hcol">Progress %</th>${range.map((d, i) => { const t = tally[i], p = d <= elapsed ? t.pct : null; return `<td class="${colCls(d)} ${p === 100 ? 'full' : ''}">${p === null ? '·' : p}</td>`; }).join('')}<td></td></tr>
      <tr><th class="hcol">Done</th>${range.map((d, i) => `<td class="${colCls(d)}">${d <= elapsed ? tally[i].done : '·'}</td>`).join('')}<td class="tot">${done}</td></tr>
      <tr><th class="hcol">Missed</th>${range.map((d, i) => `<td class="${colCls(d)} ${tally[i].missed ? 'bad' : ''}">${d < elapsed || (d === elapsed && ymd(y, m, d) < tk) ? tally[i].missed : '·'}</td>`).join('')}<td class="tot">${tally.reduce((a, t) => a + t.missed, 0)}</td></tr>
    </tfoot>
  </table></div>${LEGEND}`;

  const t0 = midnight(new Date());
  const analysis = !H.length ? `<div class="empty">Analysis appears once you have habits.</div>` : `
    <ul class="alist">${H.map((h, hi) => {
      let target, act, pace, chipHtml = '', meta = [], pills = '';
      if (h.freq === 'week'){
        const weeks = weeksForMonth(y, m).map(w => evalPeriod(h, { s: w, e: addDays(w, 6), target: Math.min(h.target, 7) }));
        target = weeks.reduce((a, w) => a + w.target, 0); act = weeks.reduce((a, w) => a + w.done, 0);
        pace = weeks.reduce((a, w) => a + (w.e < t0 ? w.target : w.s > t0 ? 0 : w.target * (dayDiff(w.s, t0) + 1) / 7), 0);
        const cur = weeks.find(w => w.s <= t0 && t0 <= w.e), past = weeks.filter(w => w.e < t0), met = past.filter(w => w.status === 'met').length;
        if (cur) chipHtml = cur.status === 'met' ? chip('good', 'Week goal met') : cur.status === 'off' ? chip('warn', 'Off track this week') : chip('good', 'On track');
        else if (past.length) chipHtml = chip(met === past.length ? 'good' : 'warn', `${met} of ${past.length} weeks met`);
        if (cur && cur.status === 'on') meta.push(`${plural(cur.restLeft, 'rest day')} left this week`);
        const ws = weekStreak(h); if (ws) meta.push(`${ws}-week streak`);
        pills = `<div class="wpills">${weeks.map(w => { const st = w.s > t0 ? 'fut' : w.status === 'met' ? 'met' : (w.e < t0 || w.status === 'off') ? 'miss' : 'cur';
          const crosses = w.s.getMonth() !== w.e.getMonth();
          return `<span class="wpill ${st}" title="Week ${isoWeek(w.s)}: ${w.s.getDate()} ${MONTHS[w.s.getMonth()].slice(0, 3)} – ${w.e.getDate()} ${MONTHS[w.e.getMonth()].slice(0, 3)}${crosses ? ' (all 7 days count, across both months)' : ''}">W${isoWeek(w.s)} <b>${w.done}/${w.target}</b></span>`; }).join('')}</div>`;
      } else {
        const per = evs[hi].periods[0];
        target = per.target; act = per.done; pace = target * elapsed / days;
        if (elapsed) chipHtml = per.status === 'met' ? chip('good', 'Goal met') : per.status === 'off' ? chip('warn', `Off track · ${per.missed} missed`) : per.status === 'short' ? chip('warn', 'Short of goal') : chip('good', 'On track');
        if (h.freq === 'month' && per.status === 'on') meta.push(`${plural(per.restLeft, 'rest day')} left`);
        if (h.freq === 'daily'){ const s = dayStreak(h); if (s) meta.push(`${s}-day streak`); }
      }
      const isCur = elapsed > 0 && elapsed < days;
      return `<li class="aitem"><span class="nm" title="${esc(h.name)}">${esc(h.name)} <span class="gtag">${shortGoal(h)}</span></span><span class="ct">${act} / ${target}</span>
        <div class="abar" role="img" aria-label="${act} of ${target} days"><i style="width:${Math.min(100, act / target * 100)}%"></i>${isCur ? `<b style="left:calc(${Math.min(100, pace / target * 100)}% - 1px)"></b>` : ''}</div>
        <div class="ameta">${chipHtml}<span>${Math.round(act / target * 100)}% of goal</span>${meta.map(x => `<span>· ${x}</span>`).join('')}</div>${pills}</li>`;
    }).join('')}</ul>`;

  return `
  <section class="mhead">
    <div class="mtitle">
      <button class="btn ghost icon" data-act="month" data-d="-1" aria-label="Previous month">‹</button>
      <h1>${MONTHS[m]}<span class="yr">${y}</span></h1>
      <button class="btn ghost icon" data-act="month" data-d="1" aria-label="Next month">›</button>
      ${(y !== new Date().getFullYear() || m !== new Date().getMonth()) ? `<button class="btn" data-act="month" data-d="0">Today</button>` : ''}
      ${UI.rp ? '' : `<button class="btn" data-act="rp-open"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Share progress</button>`}
    </div>
    <div class="stats">
      <div class="stat"><div class="v">${H.length}</div><div class="k">Habits</div></div>
      <div class="stat"><div class="v">${done}<small> / ${due}</small></div><div class="k">Done / due</div></div>
      <div class="stat"><div class="v">${perfect}</div><div class="k">Perfect days</div></div>
      <div class="stat"><div class="v">${pct}<small>%</small></div><div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Month progress"><i style="width:${pct}%"></i></div></div>
    </div>
  </section>
  ${UI.rp ? reportPanel() : ''}
  <section class="card">${grid}${addHabitForm('am')}</section>
  <div class="two">
    <section class="card"><div class="card-head"><h2>Daily progress</h2><span class="legend"><span><span class="sw"></span>Done ÷ due each day (rest days don't count)</span></span></div>
      <div class="chart" id="chart"></div></section>
    <section class="card"><div class="card-head"><h2>Analysis · goal vs actual</h2>${elapsed && elapsed < days ? `<span class="legend"><span><span class="sw"></span>Done</span><span><span class="pk"></span>Where you should be today</span></span>` : ''}</div>${analysis}</section>
  </div>`;
}

function drawChart(){
  const box = $('#chart'); if (!box || !UI.chart) return;
  const { days, elapsed, pts } = UI.chart, valid = pts.filter(p => p.pct !== null);
  if (!valid.length){ box.innerHTML = `<div class="empty">${!D().habits.length ? 'Add habits to see your daily progress.' : elapsed ? 'No habits were active yet this month.' : 'This month hasn\'t started yet.'}</div>`; box.style.height = 'auto'; return; }
  box.style.height = '';
  const W = Math.max(260, box.clientWidth), H = box.clientHeight || 220, L = 38, R = 14, T = 12, B = 26;
  const x = d => L + (d - 1) / Math.max(1, days - 1) * (W - L - R);
  const yv = p => T + (1 - p / 100) * (H - T - B);
  const segs = []; let cur = null;
  const todayPt = pts.find(p => p.today && p.pct !== null), prevPt = todayPt && pts[todayPt.d - 2];
  for (const p of pts){ if (p.pct === null || p.today){ cur = null; continue; } if (!cur){ cur = []; segs.push(cur); } cur.push(p); }
  const lineOf = s => s.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${yv(p.pct).toFixed(1)}`).join('');
  const areaOf = s => `${lineOf(s)}L${x(s[s.length - 1].d).toFixed(1)},${yv(0)}L${x(s[0].d).toFixed(1)},${yv(0)}Z`;
  const ticks = [1, 8, 15, 22, 29].filter(d => d <= days), done = valid.filter(p => !p.today), last = done[done.length - 1];
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily share of due habits completed">
    ${[0, 25, 50, 75, 100].map(p => `<line class="gl" x1="${L}" x2="${W - R}" y1="${yv(p)}" y2="${yv(p)}"/><text class="ax" x="${L - 8}" y="${yv(p) + 3.5}" text-anchor="end">${p}%</text>`).join('')}
    ${ticks.map(d => `<text class="ax" x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`).join('')}
    ${segs.map(s => s.length > 1 ? `<path class="area" d="${areaOf(s)}"/><path class="ln" d="${lineOf(s)}"/>` : '').join('')}
    ${last ? `<circle class="end" cx="${x(last.d)}" cy="${yv(last.pct)}" r="4.5"/>` : ''}
    ${todayPt ? `${prevPt && prevPt.pct !== null ? `<line class="ln today" x1="${x(prevPt.d)}" y1="${yv(prevPt.pct)}" x2="${x(todayPt.d)}" y2="${yv(todayPt.pct)}"/>` : ''}<circle class="tdot" cx="${x(todayPt.d)}" cy="${yv(todayPt.pct)}" r="4.5"/><text class="ax" x="${x(todayPt.d) + 8}" y="${yv(todayPt.pct) + (todayPt.pct > 85 ? 14 : -8)}">today so far</text>` : ''}
    <g id="hover" style="display:none"><line class="xh" y1="${T}" y2="${yv(0)}"/><circle class="end" r="5"/></g>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" hidden></div>`;
  const hit = box.querySelector('#hit'), g = box.querySelector('#hover'), tip = box.querySelector('.tip');
  const show = e => {
    const r = box.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const d = Math.min(elapsed, Math.max(1, Math.round((px - L) / (W - L - R) * (days - 1)) + 1));
    const p = pts[d - 1]; if (!p || p.pct === null){ g.style.display = 'none'; tip.hidden = true; return; }
    const cx = x(d), cy = yv(p.pct);
    g.style.display = ''; g.querySelector('line').setAttribute('x1', cx); g.querySelector('line').setAttribute('x2', cx);
    g.querySelector('circle').setAttribute('cx', cx); g.querySelector('circle').setAttribute('cy', cy);
    tip.innerHTML = `${p.today ? 'Today so far' : `${DOW[dowIdx(new Date(UI.y, UI.m, d))]} ${d} ${MONTHS[UI.m].slice(0, 3)}`} · <b>${p.pct}%</b> (${p.done}/${p.due} due)`;
    tip.hidden = false;
    tip.style.left = Math.min(r.width - 80, Math.max(80, cx * r.width / W)) + 'px'; tip.style.top = (cy * r.height / H) + 'px';
  };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tip.hidden = true; });
}

/* ================= week view ================= */
function ring(pct){
  const r = 34, c = 2 * Math.PI * r, f = c * pct / 100;
  return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="${pct}% done"><circle class="tr" cx="42" cy="42" r="${r}"/>${pct > 0 ? `<circle class="fg" cx="42" cy="42" r="${r}" stroke-dasharray="${f.toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 42 42)"/>` : ''}<text x="42" y="43">${pct}%</text></svg>`;
}
function weekGoals(H, evs, ws, we){
  if (!H.length) return '';
  const t0 = midnight(new Date());
  const rows = H.map((h, i) => {
    let num, den, st, note;
    if (h.freq === 'week'){
      const p = evs[i].periods[0]; num = p.done; den = p.target;
      st = p.status === 'met' ? chip('good', 'Met') : p.status === 'off' || p.status === 'short' ? chip('warn', 'Off track') : p.s > t0 ? '' : chip('good', 'On track');
      note = p.status === 'on' && p.s <= t0 ? `${plural(p.restLeft, 'rest day')} left` : p.status === 'off' ? `${p.missed} missed` : '';
    } else if (h.freq === 'month'){
      const ref = we < t0 ? we : ws > t0 ? ws : t0, p = evalPeriod(h, periodOf(h, ref));
      num = p.done; den = p.target; note = `in ${MONTHS[p.s.getMonth()].slice(0, 3)}${p.status === 'on' ? ` · ${plural(p.restLeft, 'rest day')} left` : ''}`;
      st = p.status === 'met' ? chip('good', 'Met') : p.status === 'off' ? chip('warn', 'Off track') : chip('good', 'On track');
    } else {
      let d0 = 0, miss = 0, n = 0; for (let d = new Date(ws); d <= we; d = addDays(d, 1)){ const s = evs[i].map[dkey(d)]; if (s && s !== 'na') n++; if (s === 'done') d0++; if (s === 'missed') miss++; }
      num = d0; den = n; note = miss ? `${miss} missed` : '';
      st = ws > t0 ? '' : miss ? chip('warn', 'Off track') : chip('good', 'On track');
    }
    return `<li class="gitem"><div class="gtop"><span class="nm">${esc(h.name)}</span><span class="ct">${num} / ${den}</span></div>
      <div class="abar"><i style="width:${den ? Math.min(100, num / den * 100) : 0}%"></i></div>
      <div class="ameta">${st}<span class="gtag">${shortGoal(h)}</span>${note ? `<span>${note}</span>` : ''}</div></li>`;
  }).join('');
  return `<section class="card"><div class="card-head"><h2>Goals this week</h2><span class="muted" style="font-size:12px">Weekly goals run Monday–Sunday, even across months</span></div><ul class="glist">${rows}</ul></section>`;
}
function weekView(){
  const H = D().habits, ws = UI.week, we = addDays(ws, 6), tk = todayKey();
  const evs = H.map(h => evalRange(h, ws, we));
  const label = ws.getMonth() === we.getMonth() ? `${ws.getDate()}–${we.getDate()} ${MONTHS[we.getMonth()]} ${we.getFullYear()}` : `${ws.getDate()} ${MONTHS[ws.getMonth()].slice(0, 3)} – ${we.getDate()} ${MONTHS[we.getMonth()].slice(0, 3)} ${we.getFullYear()}`;
  let wkDone = 0, wkAll = 0;
  const cols = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(ws, i), k = dkey(d), tasks = D().tasks[k] || [], fut = k > tk;
    const t = dayTally(evs, k), td = tasks.filter(x => x.done).length;
    const all = t.due + tasks.length, dn = t.done + td, pct = all ? Math.round(dn / all * 100) : (t.active && !fut ? 100 : 0);
    if (!fut){ wkDone += dn; wkAll += all; }
    return `<article class="day ${k === tk ? 'is-today' : ''}">
      <div class="day-h"><span class="dn">${DOW[i]}</span><span class="dd">${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}</span></div>
      <div class="ringbox">${ring(pct)}<div class="sub">Habits ${t.done}/${t.due} due · Tasks ${td}/${tasks.length}</div></div>
      <ul class="tasks">
        ${H.length ? `<li class="sec">Habits</li>${H.map((h, hi) => { const s = evs[hi].map[k]; return `<li class="titem ${s === 'done' ? 'done' : ''} ${s === 'rest' ? 'isrest' : ''}">${habitCell(h, k, s, fut, h.name)}<span class="tx">${esc(h.name)}${s === 'rest' ? ' <span class="rtag">rest</span>' : s === 'missed' ? ' <span class="rtag bad">missed</span>' : ''}</span></li>`; }).join('')}` : ''}
        <li class="sec">Tasks</li>
        ${tasks.map(t => `<li class="titem ${t.done ? 'done' : ''}"><button class="cb" data-act="task" data-k="${k}" data-t="${t.id}" aria-pressed="${!!t.done}" aria-label="${esc(t.text)}"></button><span class="tx">${esc(t.text)}</span><button class="x" data-act="deltask" data-k="${k}" data-t="${t.id}" aria-label="Delete task">×</button></li>`).join('')}
      </ul>
      <form class="tadd" data-form="addTask" data-k="${k}"><input class="input" id="t-${k}" placeholder="Add a task" maxlength="140" aria-label="Add a task for ${DOW[i]}"></form>
    </article>`;
  }).join('');
  const wp = wkAll ? Math.round(wkDone / wkAll * 100) : 0;
  return `
  <section class="mhead">
    <div class="mtitle">
      <button class="btn ghost icon" data-act="wk" data-d="-1" aria-label="Previous week">‹</button>
      <h1 style="font-size:26px">Week ${isoWeek(ws)}<span class="yr">${label}</span></h1>
      <button class="btn ghost icon" data-act="wk" data-d="1" aria-label="Next week">›</button>
      ${dkey(ws) !== dkey(startOfWeek(new Date())) ? `<button class="btn" data-act="wk" data-d="0">This week</button>` : ''}
    </div>
    <div class="stats"><div class="stat"><div class="v">${wkDone}<small> / ${wkAll}</small></div><div class="k">Done / due so far</div></div>
      <div class="stat"><div class="v">${wp}<small>%</small></div><div class="pbar"><i style="width:${wp}%"></i></div></div></div>
  </section>
  ${weekGoals(H, evs, ws, we)}
  <section class="week">${cols}</section>`;
}

/* ================= habits view ================= */
function habitsView(){
  const H = D().habits, t = new Date(), y = t.getFullYear(), m = t.getMonth();
  const wks = weeksForMonth(y, m), fw = wks[0], lw = wks[wks.length - 1];
  const fmt = d => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
  let cw = startOfWeek(new Date(y, m + 1, 0)); if (addDays(cw, 6).getMonth() === m) cw = startOfWeek(new Date(y, m, 1));
  return `<section class="hgrid">
  <div class="card">
    <div class="card-head"><h2>Your habits</h2></div>
    ${addHabitForm('ah', true)}
    ${!H.length ? `<div class="empty">No habits yet.</div>` : `<ul class="hlist">${H.map((h, i) => `
      <li class="hrow">
        <span class="mv"><button data-act="move" data-i="${i}" data-d="-1" ${i ? '' : 'disabled'} aria-label="Move up">▲</button><button data-act="move" data-i="${i}" data-d="1" ${i < H.length - 1 ? '' : 'disabled'} aria-label="Move down">▼</button></span>
        <div class="hmain">
          <input class="input" id="hn-${h.id}" data-edit="name" data-h="${h.id}" value="${esc(h.name)}" maxlength="80" aria-label="Habit name">
          <div class="goalsel">
            <select class="input" id="hf-${h.id}" data-edit="freq" data-h="${h.id}" aria-label="How often">
              <option value="daily" ${h.freq === 'daily' ? 'selected' : ''}>Every day</option>
              <option value="week" ${h.freq === 'week' ? 'selected' : ''}>Days per week</option>
              <option value="month" ${h.freq === 'month' ? 'selected' : ''}>Days per month</option></select>
            ${h.freq !== 'daily' ? `<input class="input num" id="ht-${h.id}" type="number" min="1" max="${maxTarget(h.freq)}" data-edit="target" data-h="${h.id}" value="${h.target}" aria-label="Days per ${h.freq}">` : ''}
            <span class="hint">${goalText(h)}</span>
          </div>
        </div>
        <button class="btn danger del ${UI.pendingDelete === h.id ? 'armed' : ''}" data-act="delhabit" data-h="${h.id}">${UI.pendingDelete === h.id ? 'Confirm delete' : 'Delete'}</button>
      </li>`).join('')}</ul>`}
  </div>
  <aside class="card how">
    <h2>How goals are counted</h2>
    <p><b>Rest days are free.</b> A goal of 5 days a week gives you 2 rest days each week. You pick which days. The first 2 days you skip are rest days; a 3rd skip counts as missed.</p>
    <p><b>Weeks run Monday to Sunday</b> and always count all 7 days, even when a week crosses into the next month. For example, week ${isoWeek(cw)} runs ${DOW[0]} ${fmt(cw)} – ${DOW[6]} ${fmt(addDays(cw, 6))}: gym days and rest days on either side of the month change all count toward that one week's goal.</p>
    <p><b>Each week belongs to one month</b>: the month that holds its Thursday, which is where most of its days are. So a week is never split or counted twice. In ${MONTHS[m]} ${y} that's weeks ${isoWeek(fw)}–${isoWeek(lw)} (${fmt(fw)} – ${fmt(addDays(lw, 6))}), so 5 days a week means a ${MONTHS[m]} goal of ${5 * wks.length}.</p>
    <p><b>Monthly goals</b> work the same way over the calendar month: 20 days a month in a 30-day month gives 10 rest days.</p>
    <p><b>Daily progress %</b> is done ÷ due. Rest days aren't due, so they never pull your score down. Today, a flexible habit only becomes due once you've used up your rest days.</p>
  </aside>
  </section>`;
}

    <div class="card"><h2>Lock</h2>
      <dl class="kv"><dt>Logged in as</dt><dd>${esc(D().settings.username || '—')}</dd></dl>

        <dt>Licence</dt><dd>MIT · © 2026 Manish Subba</dd>
      </dl>
      <p class="fine">A longer passcode is much harder to guess. Six random digits can be brute-forced by someone who copies the encrypted data; a phrase of four or more words can't in practice.</p>

function monthSummary(h){

  if (h.freq === 'week'){

const BUCKETS = { needs:'Needs', wants:'Wants', savings:'Savings & investing' };
const DEFAULT_CATS = [['Rent / EMI','needs'],['Groceries','needs'],['Bills & recharge','needs'],['Transport','needs'],['Health','needs'],['Family','needs'],['Eating out','wants'],['Shopping','wants'],['Entertainment','wants'],['Travel','wants'],['Subscriptions','wants'],['Other','wants'],['Savings / SIP','savings']];
function money(){
  const d = D();
  if (!d.money) d.money = { currency:'₹', split:{ needs:50, wants:30, savings:20 }, cats: DEFAULT_CATS.map(([name, bucket]) => ({ id: uid(), name, bucket })), income: [], expenses: [] };
  return d.money;
}
function fmtM(n, compact){
  const M = money(), neg = n < 0, a = Math.abs(n);
  let s;
  if (compact){
    if (M.currency === '₹') s = a >= 1e7 ? (a / 1e7).toFixed(a >= 1e8 ? 0 : 1) + 'Cr' : a >= 1e5 ? (a / 1e5).toFixed(a >= 1e6 ? 0 : 1) + 'L' : a >= 1e3 ? (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : String(Math.round(a));
    else s = a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : String(Math.round(a));
    s = s.replace(/\.0(?=[a-zA-Z])/, '');
  } else s = Math.round(a).toLocaleString(M.currency === '₹' ? 'en-IN' : 'en-US');
  return (neg ? '−' : '') + M.currency + s;
}
function monthMoney(y, m){
  const M = money(), pre = `${y}-${pad(m + 1)}`, days = new Date(y, m + 1, 0).getDate();
  const cat = Object.fromEntries(M.cats.map(c => [c.id, c]));
  const inc = M.income.filter(x => x.date.startsWith(pre)), exp = M.expenses.filter(x => x.date.startsWith(pre));
  const earned = inc.reduce((a, x) => a + x.amount, 0);
  const by = { needs:0, wants:0, savings:0 }, byCat = {}, byDay = Array(days).fill(0);
  for (const x of exp){
    const c = cat[x.cat] || { bucket:'wants' }; by[c.bucket] += x.amount; byCat[x.cat] = (byCat[x.cat] || 0) + x.amount;
    if (c.bucket !== 'savings') byDay[+x.date.slice(8) - 1] += x.amount;
  }
  const spent = by.needs + by.wants, saved = earned - spent;
  const plan = { needs: earned * M.split.needs / 100, wants: earned * M.split.wants / 100, savings: earned * M.split.savings / 100 };
  return { inc, exp, earned, by, byCat, byDay, spent, invested: by.savings, saved, rate: earned ? saved / earned : null, plan, days, cat };
}

function roiBlock(h, L, P, sessions, mins){
  const yr = perYear(h);
  if (L.roi === 'budget'){
    const t = new Date(), mm = monthMoney(t.getFullYear(), t.getMonth());
    if (!mm.earned) return `<p class="pb-big">Add this month’s income below to see your return.</p>`;
    const s = Math.max(0, mm.saved), r = 0.08 / 12, fv = s * ((Math.pow(1 + r, 120) - 1) / r);
    return `<p class="pb-big">${fmtM(mm.saved)}</p><p>kept this month, a savings rate of <b>${Math.round(mm.rate * 100)}%</b>.</p>
      ${s > 0 ? `<p>Keep that up for a year: <b>${fmtM(s * 12)}</b>. For 10 years: <b>${fmtM(s * 120)}</b> saved, or about <b>${fmtM(fv)}</b> if it grows at an assumed 8% a year.</p><p class="pb-note">An illustration, not a forecast. Returns aren’t guaranteed.</p>` : ''}`;
  }
  const minInput = (val, label, kind) => `<label class="pb-inl"><input class="input num" type="number" min="0" max="100000" id="pb-${kind}" data-pbedit="${kind}" value="${val}"> ${label}</label>`;

    const per = P.perDay ?? L.perDay;
    return `<p class="pb-big">${fmtM(sessions * per)}</p><p>kept so far over ${plural(sessions, 'day')}. At your goal that’s about <b>${fmtM(yr * per)}</b> a year.</p>${minInput(per, `${money().currency} ${L.roiLabel}`, 'perDay')}`;
  }
  const yrH = yr * mins / 60;

  if (L.roi === 'books') extra = `<p>That’s roughly <b>${Math.max(1, Math.round(yrH / 5))} books a year</b>, at about 5 hours per book.</p>`;
  if (L.roi === 'saved') extra = `<p>That’s <b>${Math.round(yrH / 24)} full days</b> a year back for things that matter.</p>`;
  return `<p class="pb-big">${hrs(sessions * mins)}<small> hours</small></p><p>${L.roi === 'saved' ? 'reclaimed' : 'invested'} so far. At your goal of ${goalText(h).split(' · ')[0].toLowerCase()}, that’s <b>${Math.round(yrH)} hours a year</b>.</p>${extra}${minInput(mins, L.roiLabel || 'minutes per session', 'minutes')}`;
}

function moneyRing(rate, target){

    <line x1="${50 + Math.cos(ta) * 32}" y1="${50 + Math.sin(ta) * 32}" x2="${50 + Math.cos(ta) * 48}" y2="${50 + Math.sin(ta) * 48}" class="tk"/>
    <text x="50" y="47" class="v">${rate}%</text><text x="50" y="62" class="l">target ${target}%</text></svg>`;
}

function drawMoney(){
