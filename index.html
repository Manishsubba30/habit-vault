  const y = UI.mY ?? new Date().getFullYear(), m = UI.mM ?? new Date().getMonth(), mm = monthMoney(y, m), M = money();
  const { elapsed } = monthInfo(y, m), shown = elapsed || 0;
  // donut of the planned split
  const dn = $('#mn-donut'), parts = ['needs', 'wants', 'savings'].map(b => [b, M.split[b]]), tot = parts.reduce((a, p) => a + p[1], 0) || 1;
  let a0 = -Math.PI / 2; const R = 70, r = 46, gap = 0.025;
  const arcs = parts.filter(p => p[1] > 0).map(([b, v]) => { const a1 = a0 + v / tot * 2 * Math.PI, s = a0 + gap, e = a1 - gap; a0 = a1; const L = e - s > Math.PI ? 1 : 0;
    const P = (rad, ang) => `${(80 + Math.cos(ang) * rad).toFixed(2)},${(80 + Math.sin(ang) * rad).toFixed(2)}`;
    return `<path class="bkf ${b}" d="M${P(R, s)} A${R},${R} 0 ${L} 1 ${P(R, e)} L${P(r, e)} A${r},${r} 0 ${L} 0 ${P(r, s)} Z"><title>${BUCKETS[b]}: ${v}%${mm.earned ? ' · ' + fmtM(mm.plan[b]) : ''}</title></path>`; }).join('');
  dn.innerHTML = `<svg viewBox="0 0 160 160" role="img" aria-label="Planned split of income">${arcs}<text x="80" y="76" class="dv">${mm.earned ? fmtM(mm.earned, true) : '—'}</text><text x="80" y="94" class="dl">${mm.earned ? 'to split' : 'add income'}</text></svg>`;

  // burn chart: cumulative spend vs even pace to spending budget (needs + wants plan)
  const box = $('#mn-burn'), W = Math.max(260, box.clientWidth), H = box.clientHeight || 220, L = 52, Rr = 16, T = 14, B = 26, days = mm.days;
  const cum = []; let run = 0; for (let d = 0; d < days; d++){ run += mm.byDay[d]; cum.push(run); }
  const budget = mm.plan.needs + mm.plan.wants, top = Math.max(budget, run, 1) * 1.1;
  const x = d => L + (d - 1) / Math.max(1, days - 1) * (W - L - Rr), yv = v => T + (1 - v / top) * (H - T - B);
  const ticks = niceTicks(top);
  const pts = cum.slice(0, shown).map((v, i) => [i + 1, v]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${yv(p[1]).toFixed(1)}`).join('');
  const lastP = pts[pts.length - 1];
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spending this month">
    ${ticks.map(v => `<line class="gl" x1="${L}" x2="${W - Rr}" y1="${yv(v)}" y2="${yv(v)}"/><text class="ax" x="${L - 8}" y="${yv(v) + 3.5}" text-anchor="end">${fmtM(v, true)}</text>`).join('')}
    ${[1, 8, 15, 22, 29].filter(d => d <= days).map(d => `<text class="ax" x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`).join('')}
    ${budget ? `<line class="pace" x1="${x(1)}" y1="${yv(budget / days)}" x2="${x(days)}" y2="${yv(budget)}"/><text class="ax" x="${W - Rr}" y="${yv(budget) - 6}" text-anchor="end">budget ${fmtM(budget, true)}</text>` : ''}
    ${pts.length > 1 ? `<path class="marea" d="${line}L${x(lastP[0])},${yv(0)}L${x(1)},${yv(0)}Z"/><path class="mln" d="${line}"/>` : ''}
    ${lastP ? `<circle class="mend" cx="${x(lastP[0])}" cy="${yv(lastP[1])}" r="4.5"/><text class="ax strong" x="${x(lastP[0]) + 8}" y="${yv(lastP[1]) - 8}">${fmtM(lastP[1], true)}</text>` : ''}
    <g class="hv" style="display:none"><line class="xh" y1="${T}" y2="${yv(0)}"/><circle class="mend" r="5"/></g>
    <rect x="${L}" y="0" width="${W - L - Rr}" height="${H}" fill="transparent" class="hit"/>
  </svg><div class="tip" hidden></div>`;
  hoverize(box, W, H, days, shown, d => [x(d), yv(cum[d - 1])], d => `${d} ${MONTHS[m].slice(0, 3)} · spent <b>${fmtM(mm.byDay[d - 1])}</b> · total <b>${fmtM(cum[d - 1])}</b>${budget ? ` of ${fmtM(budget)}` : ''}`);

  // daily bars
  const db = $('#mn-daily'), W2 = Math.max(260, db.clientWidth), H2 = db.clientHeight || 120, T2 = 10, B2 = 22;
  const dmax = Math.max(...mm.byDay, 1), dt = niceTicks(dmax * 1.1), dtop = dt[dt.length - 1] || dmax;
  const bw = (W2 - L - Rr) / days, yb = v => T2 + (1 - v / dtop) * (H2 - T2 - B2);
  const tkD = todayKey();
  db.innerHTML = `<svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Spending per day">

    ${mm.byDay.map((v, i) => { if (!v) return ''; const hgt = Math.max(2, yb(0) - yb(v)), bx = L + i * bw + Math.max(1, bw * 0.18), w = Math.max(2, bw * 0.64), rr = Math.min(4, w / 2);
      return `<path class="mbar ${ymd(y, m, i + 1) === tkD ? 'today' : ''}" d="M${bx},${yb(0)} V${yb(0) - hgt + rr} q0,-${rr} ${rr},-${rr} H${bx + w - rr} q${rr},0 ${rr},${rr} V${yb(0)} Z"/>`; }).join('')}
    ${[1, 8, 15, 22, 29].filter(d => d <= days).map(d => `<text class="ax" x="${L + (d - 0.5) * bw}" y="${H2 - 6}" text-anchor="middle">${d}</text>`).join('')}
    <g class="hv" style="display:none"><line class="xh" y1="${T2}" y2="${yb(0)}"/><circle class="mend" r="0"/></g>
    <rect x="${L}" y="0" width="${W2 - L - Rr}" height="${H2}" fill="transparent" class="hit"/>

  hoverize(db, W2, H2, days, days, d => [L + (d - 0.5) * bw, yb(mm.byDay[d - 1])], d => `${DOW[dowIdx(new Date(y, m, d))]} ${d} ${MONTHS[m].slice(0, 3)} · <b>${fmtM(mm.byDay[d - 1])}</b>`, true);
}
function niceTicks(max){
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p, step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(v); return out;
}
function hoverize(box, W, H, days, maxDay, pos, text, bars){
  const hit = box.querySelector('.hit'), g = box.querySelector('.hv'), tip = box.querySelector('.tip'), L = +hit.getAttribute('x'), HW = +hit.getAttribute('width');
  const show = e => {
    const r = box.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const d = bars ? Math.min(days, Math.max(1, Math.floor((px - L) / HW * days) + 1)) : Math.min(maxDay, Math.max(1, Math.round((px - L) / HW * (days - 1)) + 1));
    if (d > maxDay || !maxDay){ g.style.display = 'none'; tip.hidden = true; return; }
    const [cx, cy] = pos(d);
    g.style.display = ''; const ln = g.querySelector('line'); ln.setAttribute('x1', cx); ln.setAttribute('x2', cx);
    const c = g.querySelector('circle'); c.setAttribute('cx', cx); c.setAttribute('cy', cy);
    tip.innerHTML = text(d); tip.hidden = false;
    tip.style.left = Math.min(r.width - 110, Math.max(110, cx * r.width / W)) + 'px'; tip.style.top = (cy * r.height / H) + 'px';
  };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tip.hidden = true; });
}

function gym(){ const d = D(); if (!d.gym) d.gym = { unit:'kg', log:[], bw:[], photos:[] }; return d.gym; }
const LB = 2.20462;
const toU = kg => gym().unit === 'lb' ? kg * LB : kg;
const fromU = v => gym().unit === 'lb' ? v / LB : v;
const r1 = v => Math.round(v * 10) / 10;
const fmtW = (kg, unit = true) => `${r1(toU(kg)).toLocaleString('en-IN')}${unit ? ' ' + gym().unit : ''}`;
const e1rm = (w, r) => r > 1 ? w * (1 + r / 30) : w; // Epley estimate
const dLabel = k => { const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8)); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const kDate = k => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8));
function exStats(){
  const by = {};
  for (const s of [...gym().log].sort((a, b) => a.date < b.date ? -1 : 1)){
    const k = s.ex.toLowerCase(), x = by[k] || (by[k] = { name: s.ex, days: {}, best: null, sets: 0 });
    x.sets += s.sets; x.name = s.ex;
    const d = x.days[s.date] || (x.days[s.date] = { top: 0, reps: 0, e1: 0, vol: 0 }), e = e1rm(s.w, s.reps);
    if (s.w > d.top || (s.w === d.top && s.reps > d.reps)){ d.top = s.w; d.reps = s.reps; }
    d.e1 = Math.max(d.e1, e); d.vol += s.w * s.reps * s.sets;
    if (!x.best || e > x.best.e1 + 1e-9) x.best = { e1: e, w: s.w, reps: s.reps, date: s.date, first: !x.best };
  }
  return by;
}

/* ---- gym charts ---- */
function niceRange(lo, hi){
  const raw = (hi - lo) / 4 || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p, step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  const out = []; for (let v = Math.floor(lo / step) * step; v <= hi + step * 0.001; v += step) out.push(+v.toFixed(6));
  if (out[out.length - 1] < hi) out.push(out[out.length - 1] + step);
  return out;
}
function timeLine(box, pts, tip, fmtY){
  if (!box) return;
  if (!pts.length){ box.innerHTML = `<div class="empty">${box.dataset.empty}</div>`; box.style.height = 'auto'; return; }
  box.style.height = '';
  const W = Math.max(260, box.clientWidth), H = box.clientHeight || 200, L = 46, R = 18, T = 14, B = 24;
  const x0 = +pts[0].x, x1 = +pts[pts.length - 1].x, span = Math.max(1, x1 - x0);
  const ys = pts.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys), pd = (mx - mn) * 0.2 || Math.max(1, mx * 0.08);
  const ticks = niceRange(Math.max(0, mn - pd), mx + pd), lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = v => pts.length === 1 ? (L + W - R) / 2 : L + (v - x0) / span * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(+p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const last = pts[pts.length - 1], lbl = d => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
  const xt = pts.length === 1 ? [pts[0].x] : [pts[0].x, pts.length > 2 ? new Date((x0 + x1) / 2) : null, last.x].filter(Boolean);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${fmtY(v)}</text>`).join('')}
    ${xt.map((d, i) => `<text class="ax" x="${x(+d)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === xt.length - 1 ? 'end' : 'middle'}">${lbl(d)}</text>`).join('')}
    ${pts.length > 1 ? `<path class="gln" d="${line}"/>` : ''}
    ${pts.map(p => `<circle class="gdot" cx="${x(+p.x)}" cy="${y(p.y)}" r="3"/>`).join('')}
    <circle class="gend" cx="${x(+last.x)}" cy="${y(last.y)}" r="5"/>
    <g class="hv" style="display:none"><line class="xh" y1="${T}" y2="${H - B}"/><circle class="gend" r="5.5"/></g>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/>
  </svg><div class="tip" hidden></div>`;
  const hit = box.querySelector('.hit'), g = box.querySelector('.hv'), tp = box.querySelector('.tip');
  const show = e => {
    const r = box.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    let bi = 0, bd = Infinity; pts.forEach((p, i) => { const d = Math.abs(x(+p.x) - px); if (d < bd){ bd = d; bi = i; } });
    const p = pts[bi], cx = x(+p.x), cy = y(p.y);
    g.style.display = ''; g.querySelector('line').setAttribute('x1', cx); g.querySelector('line').setAttribute('x2', cx);
    g.querySelector('circle').setAttribute('cx', cx); g.querySelector('circle').setAttribute('cy', cy);
    tp.innerHTML = tip(p); tp.hidden = false;
    tp.style.left = Math.min(r.width - 110, Math.max(110, cx * r.width / W)) + 'px'; tp.style.top = (cy * r.height / H) + 'px';
  };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; tp.hidden = true; });
}
function drawGym(){
  if (!$('#gy-prog')) return;
  const G = gym(), stats = exStats();
  const x = UI.gyEx && stats[UI.gyEx];
  const pts = x ? Object.keys(x.days).sort().map(k => ({ x: kDate(k), y: r1(toU(x.days[k].top)), d: x.days[k], k })) : [];
  timeLine($('#gy-prog'), pts, p => `${dLabel(p.k)} · top set <b>${fmtW(p.d.top)} × ${p.d.reps}</b>${p.d.top ? ` · ≈${fmtW(p.d.e1)} 1RM` : ''}`, v => r1(v));
  const bw = [...G.bw].sort((a, b) => a.date < b.date ? -1 : 1).map(b => ({ x: kDate(b.date), y: r1(toU(b.w)), k: b.date }));
  timeLine($('#gy-bwc'), bw, p => `${dLabel(p.k)} · <b>${p.y} ${G.unit}</b>`, v => r1(v));
  // weekly volume, last 12 weeks
  const box = $('#gy-vol'); if (!box) return;
  const w0 = addDays(startOfWeek(new Date()), -77), weeks = [...Array(12)].map((_, i) => ({ s: addDays(w0, i * 7), v: 0 }));
  for (const s of G.log){ const i = Math.floor(dayDiff(w0, kDate(s.date)) / 7); if (i >= 0 && i < 12) weeks[i].v += toU(s.w * s.reps * s.sets); }
  if (!weeks.some(w => w.v)){ box.innerHTML = `<div class="empty">${box.dataset.empty}</div>`; box.style.height = 'auto'; return; }
  box.style.height = '';
  const W = Math.max(260, box.clientWidth), H = box.clientHeight || 120, L = 46, R = 18, T = 10, B = 22, mxv = Math.max(...weeks.map(w => w.v));
  const tk2 = niceTicks(mxv * 1.1), top = tk2[tk2.length - 1] || mxv, bw2 = (W - L - R) / 12, yb = v => T + (1 - v / top) * (H - T - B);
  const cmp = v => v >= 1e5 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(v));
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly training volume">
    ${tk2.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${yb(v)}" y2="${yb(v)}"/><text class="ax" x="${L - 8}" y="${yb(v) + 3.5}" text-anchor="end">${cmp(v)}</text>`).join('')}
    ${weeks.map((w, i) => { if (!w.v) return ''; const bx = L + i * bw2 + bw2 * 0.2, bwid = bw2 * 0.6, hh = Math.max(2, yb(0) - yb(w.v)), rr = Math.min(4, bwid / 2);
      return `<path class="gbar ${i === 11 ? 'cur' : ''}" d="M${bx},${yb(0)} V${yb(0) - hh + rr} q0,-${rr} ${rr},-${rr} H${bx + bwid - rr} q${rr},0 ${rr},${rr} V${yb(0)} Z"><title>Week of ${dLabel(dkey(w.s))}: ${Math.round(w.v).toLocaleString('en-IN')} ${G.unit}</title></path>`; }).join('')}
    ${weeks.map((w, i) => i % 3 === 0 || i === 11 ? `<text class="ax" x="${L + (i + 0.5) * bw2}" y="${H - 6}" text-anchor="middle">${i === 11 ? 'now' : dLabel(dkey(w.s))}</text>` : '').join('')}
  </svg>`;
}

/* ---- gym actions ---- */
function tickHabit(h, k){ if (h && k <= todayKey() && !checked(h.id, k)) toggleCheck(h.id, k); }
function gymSubmit(kind){
  const G = gym(), h = D().habits.find(x => x.id === UI.pb);

    const ex = $('#gy-ex').value.trim().slice(0, 40), w = Math.max(0, parseFloat($('#gy-w').value) || 0), reps = parseInt($('#gy-r').value, 10), sets = Math.max(1, Math.min(20, parseInt($('#gy-s').value, 10) || 1));
    const date = /^\d{4}-\d{2}-\d{2}$/.test($('#gy-d').value) ? $('#gy-d').value : todayKey();
    if (!ex || !(reps > 0)) return;
    const k = ex.toLowerCase(), before = exStats()[k], kg = r1(fromU(w) * 100) / 100;
    G.log.push({ id: uid(), date, ex, w: Math.round(fromU(w) * 1000) / 1000, reps, sets });
    UI.gyLastEx = ex; UI.gyLastW = w || ''; UI.gyLastR = reps; UI.gyLastS = sets; UI.gyDate = date; UI.gyEx = k;
    tickHabit(h, date);
    const after = exStats()[k];

}
async function gymAction(a, b){
  const G = gym();
  switch (a){
    case 'gy-unit': G.unit = b.dataset.u; UI.gyLastW = ''; changed(); break;
    case 'gy-del': G.log = G.log.filter(s => s.id !== b.dataset.id); changed(); break;
    case 'gy-bwdel': { G.bw = G.bw.filter(x => x.id !== b.dataset.id); changed(); const d = $('.gy-body details'); if (d) d.open = true; break; }
    case 'gy-pdel': {
      const id = b.dataset.id;
      if (UI.gyDelArm !== id){ UI.gyDelArm = id; renderView(); break; }
      UI.gyDelArm = null; G.photos = G.photos.filter(p => p.id !== id); if (UI.gyA === id) UI.gyA = null; if (UI.gyB === id) UI.gyB = null;
      await photoDel(id).catch(() => {}); changed(); break;

}
async function gymPhotoAdd(file){
  const msg = $('#gy-pmsg'), pose = $('#gy-pose').value, date = /^\d{4}-\d{2}-\d{2}$/.test($('#gy-pd').value) ? $('#gy-pd').value : todayKey();
  if (msg){ msg.textContent = 'Encrypting photo…'; msg.className = 'msg'; }
  try {
    const bytes = await imageToJpeg(file, 1400, 0.8), id = uid();
    await photoPut(id, bytes);
    gym().photos.push({ id, date, pose }); UI.gyB = id; changed(); flash('Photo encrypted and saved.');
  } catch (e){ if (msg){ msg.textContent = e && e.message === 'full' ? 'This browser is out of storage space. Delete some photos or make a backup.' : 'That file couldn’t be read as an image.'; msg.className = 'msg err'; } }

function gymChange(el){
  if (el.id === 'gy-photo-in'){ const f = el.files && el.files[0]; if (f) gymPhotoAdd(f); el.value = ''; return true; }
  const k = el.dataset.gy; if (!k) return false;
  if (k === 'ex'){ UI.gyEx = el.value; renderView(); }
  else if (k === 'a'){ UI.gyA = el.value; renderView(); }
  else if (k === 'b'){ UI.gyB = el.value; renderView(); }
  else if (k === 'date'){ UI.gyDate = el.value || null; renderView(); }
  return true;

function reportData(){
  const R = UI.rp, H = D().habits.filter(h => R.habits.includes(h.id)), t0 = midnight(new Date()), tk = todayKey();
  let start, end, period;
  if (R.period === 'week'){ start = startOfWeek(new Date()); end = addDays(start, 6); period = `Week ${isoWeek(start)} · ${start.getDate()} ${MONTHS[start.getMonth()].slice(0, 3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0, 3)} ${end.getFullYear()}`; }
  else { start = new Date(UI.y, UI.m, 1); end = new Date(UI.y, UI.m + 1, 0); period = `${MONTHS[UI.m]} ${UI.y}`; }
  const evs = H.map(h => evalRange(h, start, end));
  let done = 0, due = 0, perfect = 0;
  for (let d = new Date(start); d <= end && d <= t0; d = addDays(d, 1)){ const k = dkey(d), t = dayTally(evs, k); done += t.done; due += t.due; if (t.due && t.done === t.due && k < tk) perfect++; }
  const days = dayDiff(start, end) + 1;
  const rows = H.map((h, i) => {
    let act = 0, target;
    if (h.freq === 'week' && R.period === 'week'){ const p = evs[i].periods[0]; act = p.done; target = p.target; }
    else if (h.freq === 'week'){ const ws = weeksForMonth(UI.y, UI.m).map(w => evalPeriod(h, { s: w, e: addDays(w, 6), target: Math.min(h.target, 7) })); act = ws.reduce((a, w) => a + w.done, 0); target = ws.reduce((a, w) => a + w.target, 0); }
    else {
      for (let d = new Date(start); d <= end; d = addDays(d, 1)) if (checked(h.id, dkey(d))) act++;
      target = h.freq === 'daily' ? days : R.period === 'week' ? Math.max(1, Math.round(h.target * 7 / new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate())) : Math.min(h.target, days);
    }
    const st = h.freq === 'week' ? weekStreak(h) : h.freq === 'daily' ? dayStreak(h) : 0;
    return { name: h.name, act, target: Math.max(1, target), goal: shortGoal(h), sN: st, sU: h.freq === 'week' ? 'week' : 'day', streak: st ? `${st}-${h.freq === 'week' ? 'week' : 'day'} streak` : '' };
  });
  let gymInfo = null;
  if (R.gym && D().gym && D().gym.log.length){
    const s0 = dkey(start), s1 = dkey(end), inP = D().gym.log.filter(s => s.date >= s0 && s.date <= s1);
    const best = {}; for (const s of inP){ const k = s.ex.toLowerCase(), e = e1rm(s.w, s.reps); if (!best[k] || e > best[k].e) best[k] = { ex: s.ex, w: s.w, reps: s.reps, e }; }
    gymInfo = { sessions: new Set(inP.map(s => s.date)).size, vol: inP.reduce((a, s) => a + s.w * s.reps * s.sets, 0), top: Object.values(best).filter(b => b.w).sort((a, b) => b.e - a.e).slice(0, 3) };
  }
  return { name: (R.name || '').trim(), period, pct: due ? Math.round(done / due * 100) : 0, done, due, perfect, rows, gym: gymInfo };
}

    stat(P + 300, y + 82, `${r1(toU(d.gym.vol) / 1000)}k`, `${gym().unit} lifted`);
    let ty = y + 170; c.font = `600 26px ${SANS}`;
    for (const t of d.gym.top){ c.fillStyle = '#fff'; c.fillText(fit(t.ex, 520), P, ty); c.textAlign = 'right'; c.font = `700 26px ${MONO}`; c.fillText(`${fmtW(t.w)} × ${t.reps}`, Wc - P, ty); c.textAlign = 'left'; c.font = `600 26px ${SANS}`; ty += 42; }
    y = ty;
  }
  // footer
  c.fillStyle = 'rgba(255,255,255,.5)'; c.font = `500 20px ${SANS}`;
  const now2 = new Date(); c.fillText(`Shared ${now2.getDate()} ${MONTHS[now2.getMonth()].slice(0, 3)} ${now2.getFullYear()}  ·  tracked privately with Habit Vault`, P, Hc - 64);
  return cv;
}
function drawReportPreview(){ const img = $('#rp-img'); if (!img || !UI.rp) return; try { img.src = drawReport().toDataURL('image/png'); } catch {} }
function reportText(){
  const d = reportData(), lines = [`${d.name ? d.name + ' · ' : ''}${d.period}`, `Overall: ${d.pct}% (${d.done} of ${d.due} check-offs) · ${d.perfect} perfect days`, ''];
  for (const r of d.rows) lines.push(`• ${r.name} (${r.goal}): ${r.act}/${r.target}${r.streak ? ' · ' + r.streak : ''}`);
  if (d.gym){ lines.push('', `Gym: ${d.gym.sessions} sessions${d.gym.top.length ? ' · best lifts: ' + d.gym.top.map(t => `${t.ex} ${fmtW(t.w)}×${t.reps}`).join(', ') : ''}`); }
  lines.push('', '— tracked privately with Habit Vault'); return lines.join('\n');
}
async function reportAction(a){
  const m = $('#rp-msg'), say = (t, c) => { if (m){ m.textContent = t; m.className = 'msg ' + (c || ''); } };
  if (a === 'rp-open'){ UI.rp = UI.rp || { period: 'month', habits: null, gym: true }; renderView(); $('.rp')?.scrollIntoView({ block: 'start' }); return; }
  if (a === 'rp-close'){ UI.rp = null; renderView(); return; }
  if (a === 'rp-copy'){ const t = reportText(); try { await navigator.clipboard.writeText(t); say('Copied. Paste it into WhatsApp or anywhere.', 'ok'); } catch { say('Couldn’t copy automatically here. Download the image instead.'); } return; }
  if (a === 'rp-dl'){
    const cv = drawReport(), fname = `habit-progress-${UI.rp.period === 'week' ? 'week-' + isoWeek(new Date()) : `${UI.y}-${pad(UI.m + 1)}`}.png`;
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl){ try { await dl.save({ filename: fname, data: blob }); say('Image saved. Send it to your friend.', 'ok'); } catch (err){ say(err && err.code === 'declined' ? 'Download cancelled.' : 'Downloads aren’t available here. Long-press or right-click the preview to save it.'); } return; }
    const url = URL.createObjectURL(blob), link = document.createElement('a'); link.href = url; link.download = fname; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
    say('Downloaded. If nothing happened, long-press or right-click the preview to save it.');
  }
}
function reportChange(el){
  const k = el.dataset.rp; if (!k || !UI.rp) return false;
  const R = UI.rp;
  if (k === 'period') R.period = el.value;
  else if (k === 'gym') R.gym = el.checked;
  else if (k === 'h'){ R.habits = R.habits.filter(x => x !== el.value); if (el.checked) R.habits = D().habits.map(h => h.id).filter(id => id === el.value || R.habits.includes(id)); }
  else if (k === 'name'){ R.name = el.value; }
  drawReportPreview(); return true;
}

/* ================= actions ================= */
async function lock(){
  await flush();
  const ph = S && D().habits.find(x => x.id === UI.pb); if (ph && UI.pbEdit) cleanCustom(ph);
  S = null; revokePhotos(); resetUI();
  lockScreen();
}
function resetUI(){
  const t = new Date();
  Object.assign(UI, { view:'month', y: t.getFullYear(), m: t.getMonth(), week: startOfWeek(t), exportText:'', pendingDelete:null, pbEdit:false, pbResetArmed:false, pb:null, qi:0, rp:null, lockMode:null,
    mY:undefined, mM:undefined, gyEx:null, gyDate:null, gyA:null, gyB:null, gyDelArm:null, gyLastEx:'', gyLastW:'', gyLastR:'', gyLastS:1 });
}
function changed(){ scheduleSave(); renderView(); }
function addHabit(name, freq, target){
  name = name.trim(); if (!name) return false;
  freq = ['daily','week','month'].includes(freq) ? freq : 'daily';
  target = freq === 'daily' ? 0 : Math.max(1, Math.min(maxTarget(freq), parseInt(target, 10) || 1));
  D().habits.push({ id: uid(), name: name.slice(0, 80), created: todayKey(), freq, target }); changed(); return true;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'restore') return doRestore(b.dataset.p);
  if (a === 'lk-tab'){ UI.lockMode = b.dataset.m; return lockScreen(); }
  if (!S) return;
  if (a !== 'delhabit' && UI.pendingDelete){ UI.pendingDelete = null; if (UI.view === 'habits' && a !== 'view') renderView(); }
  if (a === 'pbgo'){ UI.view = 'playbook'; UI.pb = b.dataset.h; UI.qi = 0; renderApp(); scrollTo({ top: 0 }); return; }
  if (a === 'pb' || a.startsWith('pb-') || a.startsWith('mn-')) return pbAction(a, b);
  if (a.startsWith('gy-')) return gymAction(a, b);
  if (a.startsWith('rp-')) return reportAction(a);
  switch (a){
    case 'view': UI.view = b.dataset.v; UI.exportText = ''; renderApp(); break;
    case 'lock': lock(); break;
    case 'check': toggleCheck(b.dataset.h, b.dataset.k); { const focusSel = `[data-act="check"][data-h="${b.dataset.h}"][data-k="${b.dataset.k}"]`; changed(); $(focusSel)?.focus(); } break;
    case 'month': { const d = +b.dataset.d; if (!d){ const t = new Date(); UI.y = t.getFullYear(); UI.m = t.getMonth(); } else { const t = new Date(UI.y, UI.m + d, 1); UI.y = t.getFullYear(); UI.m = t.getMonth(); } renderView(); break; }
    case 'wk': { const d = +b.dataset.d; UI.week = d ? addDays(UI.week, 7 * d) : startOfWeek(new Date()); renderView(); break; }
    case 'task': { const t = (D().tasks[b.dataset.k] || []).find(t => t.id === b.dataset.t); if (t){ t.done = !t.done; changed(); $(`[data-act="task"][data-t="${b.dataset.t}"]`)?.focus(); } break; }
    case 'deltask': { const k = b.dataset.k; D().tasks[k] = (D().tasks[k] || []).filter(t => t.id !== b.dataset.t); if (!D().tasks[k].length) delete D().tasks[k]; changed(); break; }
    case 'move': { const H = D().habits, i = +b.dataset.i, j = i + +b.dataset.d; [H[i], H[j]] = [H[j], H[i]]; changed(); break; }
    case 'delhabit': {
      const id = b.dataset.h;
      if (UI.pendingDelete !== id){ UI.pendingDelete = id; renderView(); break; }
      UI.pendingDelete = null; D().habits = D().habits.filter(h => h.id !== id);
      for (const k of Object.keys(D().checks)){ D().checks[k] = D().checks[k].filter(x => x !== id); if (!D().checks[k].length) delete D().checks[k]; }
      changed(); break;
    }
    case 'export': { await flush(); let rec; try { rec = JSON.parse(store.get(vaultKey(S.profile))); } catch {} if (!validRecord(rec)) rec = await seal(S); const ph = await photoAllRaw(S.profile).catch(() => ({})); if (Object.keys(ph).length) rec.photos = ph; UI.exportText = JSON.stringify(rec); renderView(); break; }
    case 'copy': {
      const ta = $('#exportText'), m = $('#ex-msg');
      try { await navigator.clipboard.writeText(UI.exportText); m.textContent = 'Copied. Paste it somewhere safe.'; m.className = 'msg ok'; }
      catch { ta.focus(); ta.select(); m.textContent = 'Text selected. Press Ctrl+C (or ⌘C) to copy.'; m.className = 'msg'; }
      break;
    }
    case 'download': {
      const fname = `habit-vault-backup-${dkey(new Date())}.json`, m = $('#ex-msg');
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl){
        try { await dl.save({ filename: fname, data: UI.exportText }); m.textContent = 'Backup saved.'; m.className = 'msg ok'; }
        catch (err){ m.textContent = err && err.code === 'declined' ? 'Download cancelled.' : 'Downloads aren\'t available here. Use Copy text instead.'; m.className = 'msg'; }
        break;
      }
      const blob = new Blob([UI.exportText], { type:'application/json' }), url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = fname;
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      m.textContent = 'If no download started, use Copy text instead.'; m.className = 'msg'; break;
    }
    case 'erase': {
      if ($('#erase-conf').value.trim() !== 'ERASE'){ $('#erase-msg').textContent = 'Type ERASE in capitals to confirm.'; return; }
      const id = S.profile, rn = store.get(REMEMBER_KEY); clearTimeout(saveTimer); saveTimer = null; S = null; revokePhotos(); store.del(vaultKey(id)); store.del(throttleKey(id)); await photoClear(id).catch(() => {}); removeProfile(id);
      if (rn && await userId(rn) === id) store.del(REMEMBER_KEY);
      resetUI(); lockScreen(); break;
    }
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'createForm'){
    const name = $('#cname').value.trim().slice(0, 30), p1 = $('#pass').value, p2 = $('#pass2').value, msg = $('#lockMsg'), btn = $('#createBtn');
    if (!name) return msg.textContent = 'Pick a name you\u2019ll log in with.';
    if (p1.length < MIN_PASS) return msg.textContent = `Use at least ${MIN_PASS} characters for the passcode.`;
    if (p1 !== p2) return msg.textContent = 'The two passcodes don\'t match.';
    const id = await userId(name);
    if (store.get(vaultKey(id))) return msg.textContent = 'That name already has a vault on this device. Log in instead, or pick another name.';
    btn.disabled = true; btn.textContent = 'Encrypting…';
    const data = normalize({ habits: $('#sample').checked ? SAMPLE_HABITS.map(([n, freq, target]) => ({ id: uid(), name: n, freq, target })) : [], settings: { name, username: name } });
    PROFILE = id; S = await newSession(p1, data); S.profile = id; await persist();
    if ($('#remember').checked) store.set(REMEMBER_KEY, name);
    resetUI(); renderApp(); return;
  }
  if (f.id === 'loginForm'){
    const msg = $('#lockMsg'), btn = $('#loginBtn'), name = $('#lname').value.trim().slice(0, 30), pass = $('#pass').value;
    if (!name) return msg.textContent = 'Enter your name.';
    const id = await userId(name); PROFILE = id;
    const wait = () => Math.ceil((throttle().until - Date.now()) / 1000);
    if (wait() > 0) return msg.textContent = `Too many wrong attempts. Try again in ${wait()}s.`;
    btn.disabled = true; btn.textContent = 'Unlocking…';
    let rec = null; try { rec = JSON.parse(store.get(vaultKey(id))); } catch {}
    let sess = null;
    try {
      if (validRecord(rec)) sess = await unseal(rec, pass);
      else {
        // First login after the update: find this person's older vault by name, then by passcode.
        const L = legacyVaults(), byName = L.filter(x => x.name.trim().toLowerCase() === name.toLowerCase()), order = [...byName, ...L.filter(x => !byName.includes(x))];
        for (const x of order){ try { const r = JSON.parse(store.get(vaultKey(x.id))); if (validRecord(r)){ sess = await unseal(r, pass); await migrateLegacy(x.id, id); break; } } catch {} }
      }
    } catch {}
    if (!sess){
      const t2 = failAttempt(); btn.disabled = false; btn.textContent = 'Log in';
      msg.textContent = t2.until > Date.now() ? `Too many wrong attempts. Try again in ${wait()}s.` : `That name and passcode don\u2019t match a vault on this device.${t2.n >= 3 ? ` ${Math.max(0, 5 - t2.n)} more tries before a pause.` : ''}`;
      $('#pass').select(); return;
    }
    S = sess; S.profile = id; S.data.settings.username = name; if (!S.data.settings.name) S.data.settings.name = name;
    if ($('#remember').checked) store.set(REMEMBER_KEY, name); else store.del(REMEMBER_KEY);
    clearThrottle(); lastActivity = Date.now(); resetUI(); renderApp(); scheduleSave(); return;
  }
  if (!S) return;
  const kind = f.dataset.form;
  if (kind && kind.startsWith('mn-')) return moneySubmit(kind);
  if (kind && kind.startsWith('gy-')) return gymSubmit(kind);
  if (kind === 'addHabit'){ const p = f.dataset.p, fr = $(`#${p}-freq`).value, tg = $(`#${p}-target`).value; if (addHabit($(`#${p}-name`).value, fr, tg)){ $(`#${p}-freq`).value = fr; syncAddForm(p); if (fr !== 'daily') $(`#${p}-target`).value = tg; $(`#${p}-name`).focus(); } }
  else if (kind === 'addTask'){
    const k = f.dataset.k, inp = f.querySelector('input'), text = inp.value.trim(); if (!text) return;
    (D().tasks[k] = D().tasks[k] || []).push({ id: uid(), text: text.slice(0, 140), done: false }); changed(); $('#t-' + k)?.focus();
  }
  else if (kind === 'changePass'){
    const m = $('#cp-msg'), o = $('#cp-old').value, n1 = $('#cp-new').value, n2 = $('#cp-new2').value;
    const say = (t, c) => { m.textContent = t; m.className = 'msg ' + (c || ''); };
    if (n1.length < MIN_PASS) return say(`Use at least ${MIN_PASS} characters.`, 'err');
    if (n1 !== n2) return say('The new passcodes don\'t match.', 'err');
    say('Checking…');
    await flush();
    try { await unseal(JSON.parse(store.get(vaultKey(S.profile))), o); } catch { return say('Current passcode is wrong.', 'err'); }
    const ns = await newSession(n1, S.data); ns.profile = S.profile;
    try { await photoReencrypt(S.profile, S.key, ns.key); } catch { return say('Couldn\'t re-encrypt your photos, so the passcode wasn\'t changed.', 'err'); }
    S = ns; await persist(); UI.exportText = '';
    f.reset(); say('Passcode changed. Make a new backup: old backups still open with the old passcode.', 'ok');
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=file][id$="-file"]')){
    const p = el.id.split('-')[0], file = el.files && el.files[0]; if (!file) return;
    file.text().then(t => { $(`#${p}-text`).value = t; $(`#${p}-pass`).focus(); });
    return;
  }
  if (!S) return;
  if (el.dataset.addfreq){ syncAddForm(el.dataset.addfreq, true); return; }
  if (gymChange(el)) return;
  if (reportChange(el)) return;
  if (pbChange(el)) return;
  const ed = el.dataset.edit; if (!ed) return;
  const h = D().habits.find(h => h.id === el.dataset.h);
  if (ed === 'name' && h){ const v = el.value.trim(); if (v){ h.name = v.slice(0, 80); scheduleSave(); } else el.value = h.name; }
  if (ed === 'freq' && h){ const f = el.value; h.target = f === 'daily' ? 0 : f === 'week' ? (h.freq === 'week' ? h.target : 5) : (h.freq === 'month' ? h.target : 20); h.freq = f; changed(); }
  if (ed === 'target' && h){ h.target = Math.max(1, Math.min(maxTarget(h.freq), parseInt(el.value, 10) || 1)); changed(); }
  if (ed === 'autolock'){ D().settings.autoLock = +el.value; scheduleSave(); }
  if (ed === 'profname'){ D().settings.name = el.value.trim().slice(0, 30); scheduleSave(); }
});

function syncAddForm(p, reset){
  const f = $(`#${p}-freq`).value, t = $(`#${p}-target`);
  t.hidden = f === 'daily'; t.max = maxTarget(f);
  if (reset) t.value = f === 'week' ? 5 : 20;
}

document.addEventListener('input', e => {
  const el = e.target; if (!S || !el.dataset || el.dataset.pbc === undefined) return;
  const h = D().habits.find(x => x.id === UI.pb); if (!h) return;
  const f = el.dataset.pbc, v = el.value.slice(0, 600);
  if (f === 'tagline' || f === 'note'){ customField(h, f); pageOf(h).custom[f] = v; }
  else { const arr = customField(h, f), i = +el.dataset.i; if (f === 'quotes'){ if (arr[i]) arr[i][+el.dataset.part] = v; } else if (i < arr.length) arr[i] = v; }
  scheduleSave();
});
document.addEventListener('input', e => { const el = e.target; if (!S || !el.dataset || !['why','reward'].includes(el.dataset.pbedit)) return; const h = D().habits.find(x => x.id === UI.pb); if (h){ pageOf(h)[el.dataset.pbedit] = el.value.slice(0, 1000); scheduleSave(); } });

document.addEventListener('input', e => { const el = e.target; if (S && UI.rp && el.dataset && el.dataset.rp === 'name'){ UI.rp.name = el.value; drawReportPreview(); } });

/* ================= auto-lock & lifecycle ================= */
['pointerdown','keydown','wheel','touchstart'].forEach(ev => addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  if (!S) return; const mins = D().settings.autoLock;
  if (mins > 0 && Date.now() - lastActivity > mins * 60e3) lock();
}, 10e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S) flush(); });
addEventListener('pagehide', () => { if (S && saveTimer) persist(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S && UI.view === 'month') drawChart(); if (S && UI.view === 'playbook'){ drawMoney(); drawGym(); } if (S && UI.view === 'month' && UI.rp) drawReportPreview(); }, 120); });

lockScreen();
</script>
